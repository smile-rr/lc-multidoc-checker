# =============================================================================
# ucp600.yaml — UCP 600 golden source articles referenced by v2 rules
# =============================================================================
# ID format: UCP-{article}-{paragraph}  (paragraph optional)
# FOR SYSTEM USE ONLY — not a reproduction of ICC publications.

refs:
  - id: UCP-3
    source: UCP600
    article: "3"
    paragraph: ""
    heading: "Interpretations — Signatures"
    text: "A document may be signed by handwriting, facsimile signature, perforated signature, stamp, symbol or any other mechanical or electronic method of authentication."

  - id: UCP-6-a
    source: UCP600
    article: "6"
    paragraph: "a"
    heading: "Availability — Available With/By"
    text: "A credit must state the bank with which it is available or whether it is available with any bank. A credit must state whether it is available by sight payment, deferred payment, acceptance or negotiation."

  - id: UCP-6-c
    source: UCP600
    article: "6"
    paragraph: "c"
    heading: "Availability — Drafts on Applicant"
    text: "A credit must not be issued available by a draft drawn on the applicant."

  - id: UCP-14-a
    source: UCP600
    article: "14"
    paragraph: "a"
    heading: "Standard for Examination of Documents"
    text: "A nominated bank acting on its nomination, a confirming bank, if any, and the issuing bank must examine a presentation to determine, on the basis of the documents alone, whether or not the documents appear on their face to constitute a complying presentation."

  - id: UCP-14-c
    source: UCP600
    article: "14"
    paragraph: "c"
    heading: "Examination — Presentation Period"
    text: "A presentation including one or more original transport documents subject to articles 19, 20, 21, 22, 23, 24 or 25 must be made by or on behalf of the beneficiary not later than 21 calendar days after the date of shipment, but in any event not later than the expiry date of the credit."

  - id: UCP-14-d
    source: UCP600
    article: "14"
    paragraph: "d"
    heading: "Examination — Non-contradictory Data"
    text: "Data in a document, when read in context with the credit, the document itself and international standard banking practice, need not be identical to, but must not conflict with, data in that document, any other stipulated document, or the credit."

  - id: UCP-14-e
    source: UCP600
    article: "14"
    paragraph: "e"
    heading: "Examination — Goods Description in Other Documents"
    text: "In documents other than the commercial invoice, the description of the goods, services or performance, if stated, may be in general terms not conflicting with their description in the credit."

  - id: UCP-14-f
    source: UCP600
    article: "14"
    paragraph: "f"
    heading: "Examination — Non-specified Documents"
    text: "If a credit requires presentation of a document other than a transport document, insurance document or commercial invoice, without stipulating by whom the document is to be issued or its data content, banks will accept the document as presented if its content appears to fulfil the function of the required document and otherwise complies with sub-article 14(a)."

  - id: UCP-14-h
    source: UCP600
    article: "14"
    paragraph: "h"
    heading: "Examination — Non-documentary Conditions"
    text: "If a credit contains a condition without stipulating the document to indicate compliance, banks will deem such condition as not stated and will disregard it."

  - id: UCP-14-i
    source: UCP600
    article: "14"
    paragraph: "i"
    heading: "Examination — Document Date"
    text: "A document may be dated prior to the issuance date of the credit, but must not be dated later than its date of presentation."

  - id: UCP-14-j
    source: UCP600
    article: "14"
    paragraph: "j"
    heading: "Examination — Addresses"
    text: "When the addresses of the beneficiary and the applicant appear in any stipulated document, they need not be the same as those stated in the credit or in any other stipulated document, but must be within the same country as the respective addresses mentioned in the credit."

  - id: UCP-16
    source: UCP600
    article: "16"
    paragraph: ""
    heading: "Discrepant Documents — Notice"
    text: "When a nominated bank, confirming bank, or issuing bank decides to refuse to honour or negotiate, it must give a single notice to that effect to the presenter, no later than the close of the fifth banking day following the day of presentation."

  - id: UCP-17
    source: UCP600
    article: "17"
    paragraph: ""
    heading: "Original Documents and Copies"
    text: "At least one original of each document stipulated in the credit must be presented. A document apparently bearing the document issuer's original signature, mark, stamp, or label is treated as an original."

  - id: UCP-18-a-i
    source: UCP600
    article: "18"
    paragraph: "a(i)"
    heading: "Commercial Invoice — Issued by Beneficiary"
    text: "A commercial invoice must appear to have been issued by the beneficiary (except as provided in article 38)."

  - id: UCP-18-a-ii
    source: UCP600
    article: "18"
    paragraph: "a(ii)"
    heading: "Commercial Invoice — Made Out in Name of Applicant"
    text: "A commercial invoice must be made out in the name of the applicant (except as provided in sub-article 38(g))."

  - id: UCP-18-a-iii
    source: UCP600
    article: "18"
    paragraph: "a(iii)"
    heading: "Commercial Invoice — Same Currency"
    text: "A commercial invoice must be made out in the currency of the credit."

  - id: UCP-18-a-iv
    source: UCP600
    article: "18"
    paragraph: "a(iv)"
    heading: "Commercial Invoice — Need Not Be Signed"
    text: "A commercial invoice need not be signed."

  - id: UCP-18-b
    source: UCP600
    article: "18"
    paragraph: "b"
    heading: "Commercial Invoice — Amount"
    text: "The amount of a commercial invoice must not exceed the amount permitted by the credit."

  - id: UCP-18-c
    source: UCP600
    article: "18"
    paragraph: "c"
    heading: "Commercial Invoice — Goods Description"
    text: "The description of the goods, services or performance in a commercial invoice must correspond with that appearing in the credit."

  - id: UCP-18-d
    source: UCP600
    article: "18"
    paragraph: "d"
    heading: "Commercial Invoice — Signature"
    text: "An invoice need not be signed unless the credit specifically requires a signed invoice."

  - id: UCP-20-a-i
    source: UCP600
    article: "20"
    paragraph: "a(i)"
    heading: "Bill of Lading — Carrier and Signature"
    text: "A bill of lading must indicate the name of the carrier and be signed by the carrier or a named agent for or on behalf of the carrier, or the master or a named agent for or on behalf of the master. Any signature by an agent must indicate whether the agent has signed for or on behalf of the carrier or for or on behalf of the master."

  - id: UCP-20-a-ii
    source: UCP600
    article: "20"
    paragraph: "a(ii)"
    heading: "Bill of Lading — On Board"
    text: "A bill of lading must indicate that the goods have been shipped on board a named vessel at the port of loading stated in the credit, by pre-printed wording or by an on board notation indicating the date on which the goods have been shipped on board."

  - id: UCP-20-a-iii
    source: UCP600
    article: "20"
    paragraph: "a(iii)"
    heading: "Bill of Lading — Ports"
    text: "A bill of lading must indicate the port of loading and the port of discharge as stated in the credit."

  - id: UCP-20-a-iv
    source: UCP600
    article: "20"
    paragraph: "a(iv)"
    heading: "Bill of Lading — Full Set"
    text: "A bill of lading must be the sole original or, if issued in more than one original, be the full set as indicated on the bill of lading."

  - id: UCP-20-a-vi
    source: UCP600
    article: "20"
    paragraph: "a(vi)"
    heading: "Bill of Lading — Charter Party"
    text: "A bill of lading must contain no indication that it is subject to a charter party."

  - id: UCP-20-c
    source: UCP600
    article: "20"
    paragraph: "c"
    heading: "Bill of Lading — Transhipment"
    text: "A bill of lading may indicate that the goods will or may be transhipped provided that the entire carriage is covered by one and the same bill of lading."

  - id: UCP-22
    source: UCP600
    article: "22"
    paragraph: ""
    heading: "Charter Party Bill of Lading"
    text: "A bill of lading, however named, containing an indication that it is subject to a charter party (charter party bill of lading) must be signed by the master, owner, charterer, or a named agent for any of them, and meet the other requirements of article 22."

  - id: UCP-26
    source: UCP600
    article: "26"
    paragraph: ""
    heading: "On Deck, Shipper's Load and Count"
    text: "A transport document must not indicate that the goods are or will be loaded on deck. A clause stating goods may be loaded on deck is acceptable. A transport document bearing a clause such as 'shipper's load and count' or 'said by shipper to contain' is acceptable."

  - id: UCP-26-a
    source: UCP600
    article: "26"
    paragraph: "a"
    heading: "On Deck"
    text: "A transport document must not indicate that the goods are or will be loaded on deck. A clause on a transport document stating that the goods may be loaded on deck is acceptable."

  - id: UCP-27
    source: UCP600
    article: "27"
    paragraph: ""
    heading: "Clean Transport Document"
    text: "A bank will only accept a clean transport document. A clean transport document is one bearing no clause or notation expressly declaring a defective condition of the goods or their packaging. The word 'clean' need not appear on a transport document."

  - id: UCP-28-a
    source: UCP600
    article: "28"
    paragraph: "a"
    heading: "Insurance — Issuer and Signature"
    text: "An insurance document, such as an insurance policy, an insurance certificate or a declaration under an open cover, must appear to be issued and signed by an insurance company, an underwriter or their agents or proxies."

  - id: UCP-28-b
    source: UCP600
    article: "28"
    paragraph: "b"
    heading: "Insurance — Originals"
    text: "When the insurance document indicates that it has been issued in more than one original, all originals must be presented."

  - id: UCP-28-c
    source: UCP600
    article: "28"
    paragraph: "c"
    heading: "Insurance — Cover Notes"
    text: "Cover notes will not be accepted."

  - id: UCP-28-e
    source: UCP600
    article: "28"
    paragraph: "e"
    heading: "Insurance — Date"
    text: "The date of the insurance document must be no later than the date of shipment, unless it appears from the insurance document that the cover is effective from a date not later than the date of shipment."

  - id: UCP-28-f
    source: UCP600
    article: "28"
    paragraph: "f"
    heading: "Insurance — Coverage Amount"
    text: "The insurance document must indicate the amount of insurance coverage and be in the same currency as the credit. The amount of coverage must be at least 110% of the CIF or CIP value of the goods."

  - id: UCP-28-f-i
    source: UCP600
    article: "28"
    paragraph: "f(i)"
    heading: "Insurance — Currency"
    text: "An insurance document must indicate that the amount of insurance coverage is in the same currency as the credit."

  - id: UCP-28-f-ii
    source: UCP600
    article: "28"
    paragraph: "f(ii)"
    heading: "Insurance — 110% Rule"
    text: "When the CIF or CIP value cannot be determined from the documents, the amount of insurance coverage must be calculated on the basis of the amount for which honour or negotiation is requested, or on the gross value of the goods as shown on the invoice, whichever is greater. The minimum coverage is 110% of that value."

  - id: UCP-28-f-iii
    source: UCP600
    article: "28"
    paragraph: "f(iii)"
    heading: "Insurance — Coverage Route"
    text: "The insurance document must indicate that risks are covered at least between the place of taking in charge or shipment and the place of discharge or final destination as stated in the credit."

  - id: UCP-28-g
    source: UCP600
    article: "28"
    paragraph: "g"
    heading: "Insurance — Risks Covered"
    text: "A credit should state the type of insurance required and, if any, the additional risks to be covered. An insurance document will be accepted without regard to any risks that are not covered if the credit uses imprecise terms such as 'usual risks' or 'customary risks'."

  - id: UCP-28-h
    source: UCP600
    article: "28"
    paragraph: "h"
    heading: "Insurance — All Risks"
    text: "When a credit requires insurance against 'all risks' and an insurance document is presented containing any 'all risks' notation or clause, whether or not bearing the heading 'all risks', the insurance document will be accepted without regard to any risks stated to be excluded."

  - id: UCP-30-a
    source: UCP600
    article: "30"
    paragraph: "a"
    heading: "Tolerance — About/Approximately"
    text: "The words 'about' or 'approximately' used in connection with the amount of the credit or the quantity or the unit price stated in the credit are to be construed as allowing a tolerance not to exceed 10% more or 10% less than the amount, the quantity or the unit price to which they refer."

  - id: UCP-30-b
    source: UCP600
    article: "30"
    paragraph: "b"
    heading: "Tolerance — Bulk Goods"
    text: "A tolerance not to exceed 5% more or 5% less than the quantity of the goods is allowed, provided the credit does not state the quantity in terms of a stipulated number of packing units or individual items and the total amount of the drawings does not exceed the amount of the credit."

  - id: UCP-30-c
    source: UCP600
    article: "30"
    paragraph: "c"
    heading: "Tolerance — Underdrawing"
    text: "Even when partial shipments are not allowed, a tolerance not to exceed 5% less than the amount of the credit is allowed, provided that the quantity of the goods, if stated in the credit, is shipped in full and a unit price, if stated in the credit, is not reduced."

  - id: UCP-41
    source: UCP600
    article: "41"
    paragraph: ""
    heading: "Document Title"
    text: "Documents may have a title described in the credit, a similar title or no title at all. The data content of the document must appear to fulfil the function of the required document."
