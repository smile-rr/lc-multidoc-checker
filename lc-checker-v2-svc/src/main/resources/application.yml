# lc-checker-v2-api — runtime configuration
#
# Operational config is hardcoded here. Only secrets/keys come from env (.env
# locally, infra/.env.ubuntu in Docker). To change a knob: edit this file in
# one place, rebuild, redeploy. No need to also touch .env files.

spring:
  config:
    import:
      - optional:file:../.env[.properties]
  application:
    name: lc-checker-v2-api
  profiles:
    active: default
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration

  ai:
    openai:
      api-key: ${LLM_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        completions-path: /chat/completions
        options:
          model: qwen3.6-flash-2026-04-16
          temperature: 0.0
          max-tokens: 800
          additional-model-request-fields:
            enable_thinking: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB   # v2 accepts 7 docs per session

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  datasource:
    url: jdbc:postgresql://192.168.31.214:5436/lc_checker
    username: lcuser
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      connection-test-query: SELECT 1
      validation-timeout: 3000
      keepalive-time: 60000

  jackson:
    serialization:
      write-dates-as-timestamps: false

# --- Agentic loop hard cap ----------------------------------------------------
# One iteration = one chat completion + (optionally) one tool-execution round.
# Rule-level Rule.maxIterations overrides this when set in catalog.yml.
app:
  llm:
    max-iterations: 3

server:
  port: 9082

# --- Vision LLM slots 1–4 (uniform config) ------------------------------------
# Default: slots 1+2 enabled — both Bailian Qwen3 models for consensus voting.
# Slots fire sequentially per doc (in upload order); within each doc, enabled
# slots run in parallel; consensus = majority vote; slot-1 wins on tie.
# Provider switch is config-only (URL + key). Source label in DB/UI: <model>_<N>.
vision-llm:
  slot-1:
    enabled:          true
    base-url:         https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key:          ${VISION_1_API_KEY:}
    model:            qwen3.5-flash-2026-02-23
    render-dpi:       150
    max-pages:        5
    max-long-edge-px: 2048
    timeout-seconds:  60
  slot-2:
    enabled:          true
    base-url:         https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key:          ${VISION_2_API_KEY:}
    model:            qwen3.6-35b-a3b
    render-dpi:       150
    max-pages:        5
    max-long-edge-px: 2048
    timeout-seconds:  60
  slot-3:
    enabled:          false
    base-url:         https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key:          ${VISION_3_API_KEY:}
    model:            qwen3.6-plus-2026-04-02
    render-dpi:       200
    max-pages:        10
    max-long-edge-px: 2048
    timeout-seconds:  120
  slot-4:
    enabled:          false
    base-url:         https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key:          ${VISION_4_API_KEY:}
    model:            qwen3.6-27b
    render-dpi:       200
    max-pages:        10
    max-long-edge-px: 2048
    timeout-seconds:  120

extractor:
  confidence-threshold: 0.80

# --- File storage (MinIO — shared with v1, separate bucket/prefix) -----------
storage:
  minio:
    enabled:    true
    endpoint:   http://192.168.31.214:9000
    bucket:     lc-pdfs-v2
    region:     us-east-1
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    path-style: true
    path-prefix: v2/
    request-timeout-seconds: 30

# --- Rule catalog and field pool --------------------------------------------
rules:
  catalog-path: classpath:/rules/catalog.yml

fields:
  pool-path:      classpath:/fields/field-pool.yaml
  tag-mapping-path: classpath:/fields/lc-tag-mapping.yaml
  registry-path:  classpath:/fields/doc-type-registry.yaml

# --- Pipeline queue ---------------------------------------------------------
pipeline:
  concurrency: 1
  poll-delay-ms: 2000

# --- Session settings -------------------------------------------------------
session:
  ttl-minutes: 120
  max-size: 500

# --- Dev mode ---------------------------------------------------------------
# When dev-mode=true: UI shows "Confirm All" and "Pass All" buttons in Examine.
# Flip to false for production demos.
dev-mode: true

# --- Preset bundles ---------------------------------------------------------
# Filesystem dir scanned for test-case bundles served via GET /api/v2/presets.
presets:
  dir: ${PRESETS_DIR:../test/cases}
  max-count: 3

# --- Actuator + Prometheus + Tracing → Langfuse -----------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://192.168.31.214:3300/api/public/otel/v1/traces
      headers:
        Authorization: Basic ${LANGFUSE_AUTH_BASIC:}
      compression: gzip
      timeout: 10s

spring.ai.chat.observations:
  include-prompt: true
  include-completion: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false
  default-produces-media-type: application/json
  packagesToScan: com.lc.v2.checker.api

logging:
  level:
    root: INFO
    com.lc.v2.checker: DEBUG
    org.springframework.ai: INFO
    io.opentelemetry.exporter.internal.http: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %X{sessionId:-} %X{stage:-} %X{ruleId:-} %logger{36} - %msg%n"
