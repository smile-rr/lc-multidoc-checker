# =============================================================================
# catalog.yml — v2 rule catalog (19 rules)
# =============================================================================
#
# SoT: docs/architecture/rule-set.md (Phase 2 deliverable 1).
# Companion: docs/architecture/production-readiness.md (architecture rationale).
#
# COVERAGE TABLE — quick scan of every rule
# -----------------------------------------------------------------------------
# ID         TIER          SEV       SCOPE                  AUTH (top 3)                 CONCERN
# -----------------------------------------------------------------------------
# DATE-01    PROGRAMMATIC  MAJOR     INV,BOL,PKL,BOE,BC,WC  UCP-14-c,UCP-14-i            Doc dates within valid window
# DATE-02    AGENT_TOOL    CRITICAL  BOL                    UCP-14-c                     Presentation within window and before LC expiry
# DATE-03    PROGRAMMATIC  CRITICAL  BOL                    UCP-14-c                     Latest shipment date observed
# AMT-01     AGENT_TOOL    CRITICAL  INV                    UCP-18-b,UCP-30-b            Invoice amount and currency conform to LC, within tolerance
# AMT-02     PROGRAMMATIC  CRITICAL  BOE,INV                UCP-18-b                     BOE amount equals invoice amount and conforms to LC
# DOCSET-01  AGENT         CRITICAL  INV,BOL,PKL,BOE,BC,WC  UCP-14-a,UCP-14-f,ISBP-A1    Every required document is presented
# DOCSET-02  PROGRAMMATIC  CRITICAL  BOL                    UCP-17,UCP-20-a-4            Full set of originals presented (transport doc)
# GOODS-01   AGENT         MAJOR     INV                    UCP-18-c,UCP-14-e,ISBP-C3    Invoice goods description corresponds to :45A:
# TRANS-01   PROGRAMMATIC  CRITICAL  BOL                    UCP-20-a-2                   B/L bears on-board notation and date
# TRANS-02   AGENT         MAJOR     BOL                    UCP-27,ISBP-D25              B/L is clean (no defect/damage clauses)
# TRANS-03   AGENT         CRITICAL  BOL                    UCP-20-a-3                   Ports of loading and discharge match LC
# TRANS-04   AGENT         MAJOR     BOL,INV                UCP-26,ISBP-D24              Freight terms conform to LC and Incoterm
# PARTY-01   AGENT         MAJOR     INV,BOL,PKL,BOE,BC,WC  UCP-14-j,ISBP-A14,ISBP-A19   Beneficiary and applicant identity consistent across documents
# PARTY-02   AGENT         CRITICAL  BOE                    ISBP-A19,ISBP-A20            BOE drawee matches LC stipulated drawee
# XD-01      PROGRAMMATIC  MAJOR     INV,PKL,BOL            UCP-14-e,ISBP-C2             Quantity, weight, and shipping marks consistent across INV/PKL/BOL
# XD-02      AGENT         MAJOR     PKL,BOL                UCP-14-e                     Goods description on PKL/BOL not inconsistent with INV/LC
# CERT-01    AGENT         MAJOR     BC,WC                  UCP-14-a,UCP-14-f,ISBP-Q1    Certificate content satisfies stipulating LC clauses
# CERT-02    AGENT         MAJOR     BC,WC                  ISBP-A12,ISBP-Q3             Certificate signature and form requirements
# COND-47A   AGENTIC       MAJOR     INV,BOL,PKL,BOE,BC,WC  UCP-14-a,UCP-14-d,ISBP-A1    Additional conditions (:47A:) compliance
# -----------------------------------------------------------------------------
# Tally: 6 PROG · 9 AGENT · 2 AGENT_TOOL · 1 AGENTIC · 8 CRITICAL · 11 MAJOR
#
# Concern-prefix scheme (concern-driven, not doc-driven):
#   DATE   · date conformance         AMT  · amount/currency/arithmetic
#   DOCSET · required-document set    GOODS · goods description correspondence
#   TRANS  · transport-doc specifics  PARTY · cross-doc party identity
#   XD     · cross-doc factual        CERT  · BC/WC content + form
#   COND   · :47A: free-text aggregate (one rule, N sub-results)
#
# Execution tiers (check_type):
#   PROGRAMMATIC — SpEL on #lc / #docs / #presentationDate; <100ms; deterministic
#   AGENT        — single ChatClient call, structured JSON, no tools
#   AGENT_TOOL   — ChatClient + compute tool (date math, arithmetic), max 3 LLM calls
#   AGENTIC      — multi-iteration tool-using loop. COND-47A uses execution_strategy
#                  "structured_output" (default) — single multi-iter call returns
#                  terminal JSON with `condition_results[]` per :47A: condition.
#                  Future "sub_agent" strategy will fan out to N parallel AGENT calls;
#                  output shape unchanged.
#
# Trigger semantics (rule-set.md §1):
#   triggers.all_of/any_of with docs_present + lc_field_present nodes.
#   Trigger fail → NOT_APPLICABLE recorded with trace (never silent skip).
#   Missing-required-doc as a discrepancy is owned exclusively by DOCSET-01.
#
# Citations: by id only. UCP/ISBP text resolves at execution time from
# refs/ucp600.yaml + refs/isbp821.yaml via {{ref.<id>.text}} tokens in .st
# prompts. No inline ucp_excerpt anywhere.

rules:

  # ---------------------------------------------------------------------------
  # DATE-01 · All presented documents dated in valid window — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: DATE-01
    name: Doc dates within valid window
    version: 1
    canonical_field: document_date
    applies_to: [INV, BOL, PKL, BOE, BC, WC]
    scope: [INV, BOL, PKL, BOE, BC, WC]
    triggers:
      any_of:
        - docs_present: [INV]
        - docs_present: [BOL]
        - docs_present: [PKL]
        - docs_present: [BOE]
        - docs_present: [BC]
        - docs_present: [WC]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-c, UCP-14-i]
    isbp_refs: []
    field_keys: [invoice_date, bl_date, pkl_date, boe_date, bc_date, wc_date, document_date]
    expression: |
      T(com.lc.v2.checker.stage.compliance.MultiDocHelpers).docDatesValid(
        #docs, T(java.time.LocalDate).parse(#presentationDate))
    enabled: true

  # ---------------------------------------------------------------------------
  # DATE-02 · Presentation within window and before LC expiry — AGENT_TOOL
  # ---------------------------------------------------------------------------
  - rule_id: DATE-02
    name: Presentation within window and before LC expiry
    version: 1
    canonical_field: presentation_date
    applies_to: [BOL, LC]
    scope: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lc_fields_required: [expiry_date]
    check_type: AGENT_TOOL
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-14-c]
    isbp_refs: []
    field_keys: [shipment_date, bl_date, expiry_date, presentation_days]
    enabled: true
    max_iterations: 3

  # ---------------------------------------------------------------------------
  # DATE-03 · Latest shipment date observed — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: DATE-03
    name: Latest shipment date observed
    version: 1
    canonical_field: shipment_date
    applies_to: [BOL, LC]
    scope: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
        - lc_field_present: [latest_shipment_date]
    lc_fields_required: [latest_shipment_date]
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-14-c]
    isbp_refs: []
    field_keys: [shipment_date, bl_date, latest_shipment_date]
    expression: |
      T(com.lc.v2.checker.stage.compliance.MultiDocHelpers).shipmentNotLate(
        #docs['BOL'], #lc['latest_shipment_date'])
    enabled: true

  # ---------------------------------------------------------------------------
  # AMT-01 · Invoice amount/currency conform to LC, within tolerance — AGENT_TOOL
  # ---------------------------------------------------------------------------
  - rule_id: AMT-01
    name: Invoice amount and currency conform to LC, within tolerance
    version: 1
    canonical_field: invoice_total
    applies_to: [INV, LC]
    scope: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
        - lc_field_present: [credit_currency, credit_amount]
    lc_fields_required: [credit_currency, credit_amount]
    check_type: AGENT_TOOL
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-18-b, UCP-30-b]
    isbp_refs: []
    field_keys:
      - credit_currency
      - credit_amount
      - tolerance_plus
      - tolerance_minus
      - max_amount_flag
      - additional_conditions
      - invoice_total
      - quantity
      - unit_price
    enabled: true
    max_iterations: 3

  # ---------------------------------------------------------------------------
  # AMT-02 · BOE amount equals invoice amount and conforms to LC — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: AMT-02
    name: BOE amount equals invoice amount and conforms to LC
    version: 1
    canonical_field: amount
    applies_to: [BOE, INV]
    scope: [BOE, INV]
    triggers:
      all_of:
        - docs_present: [BOE]
        - docs_present: [INV]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-18-b]
    isbp_refs: []
    field_keys: [draft_amount, invoice_total]
    expression: |
      T(com.lc.v2.checker.stage.compliance.MultiDocHelpers).amountsEqual(
        #docs['BOE']?.get('draft_amount'), #docs['INV']?.get('invoice_total'))
    enabled: true

  # ---------------------------------------------------------------------------
  # DOCSET-01 · Every required document is presented — AGENT
  # Owns the missing-required-doc discrepancy. Other rules NOT_APPLICABLE on absence.
  # ---------------------------------------------------------------------------
  - rule_id: DOCSET-01
    name: Every required document is presented
    version: 1
    canonical_field: documents_required
    applies_to: [LC]
    scope: [INV, BOL, PKL, BOE, BC, WC]
    triggers:
      all_of:
        - lc_field_present: [documents_required]
    lc_fields_required: [documents_required]
    check_type: AGENT
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-14-a, UCP-14-f]
    isbp_refs: [ISBP-A1]
    field_keys: [documents_required, additional_conditions]
    enabled: true

  # ---------------------------------------------------------------------------
  # DOCSET-02 · Full set of originals presented (transport doc) — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: DOCSET-02
    name: Full set of originals presented (transport doc)
    version: 1
    canonical_field: originals_presented
    applies_to: [BOL]
    scope: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-17, UCP-20-a-4]
    isbp_refs: []
    field_keys: [originals_required, originals_presented]
    expression: |
      T(com.lc.v2.checker.stage.compliance.MultiDocHelpers).fullSetPresented(#docs['BOL'])
    enabled: true

  # ---------------------------------------------------------------------------
  # GOODS-01 · Invoice goods description corresponds to :45A: — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: GOODS-01
    name: "Invoice goods description corresponds to :45A:"
    version: 1
    canonical_field: goods_description
    applies_to: [INV, LC]
    scope: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
        - lc_field_present: [goods_description]
    lc_fields_required: [goods_description]
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-18-c, UCP-14-e]
    isbp_refs: [ISBP-C3, ISBP-A19]
    field_keys: [goods_description, invoice_total]
    enabled: true

  # ---------------------------------------------------------------------------
  # TRANS-01 · B/L bears on-board notation and date — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: TRANS-01
    name: B/L bears on-board notation and date
    version: 1
    canonical_field: onboard_notation
    applies_to: [BOL]
    scope: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-20-a-2]
    isbp_refs: []
    field_keys: [onboard_notation, bl_date, shipment_date]
    expression: |
      T(com.lc.v2.checker.stage.compliance.MultiDocHelpers).bolOnBoardCheck(#docs['BOL'])
    enabled: true

  # ---------------------------------------------------------------------------
  # TRANS-02 · B/L is clean (no defect/damage clauses) — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: TRANS-02
    name: B/L is clean (no defect/damage clauses)
    version: 1
    canonical_field: clean_indicator
    applies_to: [BOL]
    scope: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-27]
    isbp_refs: [ISBP-D25]
    field_keys: [clean_indicator, on_deck_notation]
    enabled: true

  # ---------------------------------------------------------------------------
  # TRANS-03 · Ports of loading and discharge match LC — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: TRANS-03
    name: Ports of loading and discharge match LC
    version: 1
    canonical_field: port_of_loading
    applies_to: [BOL, LC]
    scope: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
        - any_of:
            - lc_field_present: [port_of_loading]
            - lc_field_present: [port_of_discharge]
    lc_fields_required: []
    check_type: AGENT
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-20-a-3]
    isbp_refs: []
    field_keys: [port_of_loading, port_of_discharge, additional_conditions]
    enabled: true

  # ---------------------------------------------------------------------------
  # TRANS-04 · Freight terms conform to LC and Incoterm — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: TRANS-04
    name: Freight terms conform to LC and Incoterm
    version: 1
    canonical_field: freight_terms
    applies_to: [BOL, INV]
    scope: [BOL, INV]
    triggers:
      all_of:
        - docs_present: [BOL]
        - docs_present: [INV]
    lc_fields_required: []
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-26]
    isbp_refs: [ISBP-D24]
    field_keys: [incoterms, freight_terms, on_deck_notation]
    enabled: true

  # ---------------------------------------------------------------------------
  # PARTY-01 · Beneficiary/applicant identity consistent across docs — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: PARTY-01
    name: Beneficiary and applicant identity consistent across documents
    version: 1
    canonical_field: beneficiary_name
    applies_to: [LC, INV, BOL, PKL, BOE, BC, WC]
    scope: [INV, BOL, PKL, BOE, BC, WC]
    triggers:
      all_of:
        - any_of:
            - docs_present: [INV]
            - docs_present: [BOL]
            - docs_present: [PKL]
            - docs_present: [BOE]
            - docs_present: [BC]
            - docs_present: [WC]
        - lc_field_present: [beneficiary_name, applicant_name]
    lc_fields_required: [beneficiary_name, applicant_name]
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-j]
    isbp_refs: [ISBP-A14, ISBP-A19, ISBP-A20]
    field_keys: [beneficiary_name, beneficiary_address, applicant_name, applicant_address, consignee, notify_party]
    enabled: true

  # ---------------------------------------------------------------------------
  # PARTY-02 · BOE drawee matches LC stipulated drawee — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: PARTY-02
    name: BOE drawee matches LC stipulated drawee
    version: 1
    canonical_field: drawee_name
    applies_to: [BOE, LC]
    scope: [BOE]
    triggers:
      all_of:
        - docs_present: [BOE]
        - any_of:
            - lc_field_present: [drawee_bic]
            - lc_field_present: [drafts_at]
            - lc_field_present: [available_with]
    lc_fields_required: []
    check_type: AGENT
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: []
    isbp_refs: [ISBP-A19, ISBP-A20]
    field_keys: [drawee_name, drawee_bic, drafts_at, available_with, additional_conditions]
    enabled: true

  # ---------------------------------------------------------------------------
  # XD-01 · Quantity/weight/marks consistent across INV/PKL/BOL — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: XD-01
    name: Quantity, weight, and shipping marks consistent across INV/PKL/BOL
    version: 1
    canonical_field: quantity
    applies_to: [INV, PKL, BOL]
    scope: [INV, PKL, BOL]
    triggers:
      any_of:
        - all_of:
            - docs_present: [INV]
            - docs_present: [PKL]
        - all_of:
            - docs_present: [INV]
            - docs_present: [BOL]
        - all_of:
            - docs_present: [PKL]
            - docs_present: [BOL]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-e]
    isbp_refs: [ISBP-C2]
    field_keys: [quantity, total_packages, total_net_weight, total_gross_weight, shipping_marks]
    expression: |
      T(com.lc.v2.checker.stage.compliance.MultiDocHelpers).quantitiesConsistent(
        #docs['INV'], #docs['PKL'], #docs['BOL'])
    enabled: true

  # ---------------------------------------------------------------------------
  # XD-02 · Goods description on PKL/BOL not inconsistent with INV/LC — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: XD-02
    name: Goods description on PKL/BOL not inconsistent with INV/LC
    version: 1
    canonical_field: goods_description
    applies_to: [INV, PKL, BOL, LC]
    scope: [PKL, BOL]
    triggers:
      all_of:
        - docs_present: [INV]
        - any_of:
            - docs_present: [PKL]
            - docs_present: [BOL]
        - lc_field_present: [goods_description]
    lc_fields_required: [goods_description]
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-e]
    isbp_refs: []
    field_keys: [goods_description]
    enabled: true

  # ---------------------------------------------------------------------------
  # CERT-01 · Certificate content satisfies stipulating LC clauses (BC + WC) — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: CERT-01
    name: Certificate content satisfies stipulating LC clauses
    version: 1
    canonical_field: bc_conditions_text
    applies_to: [BC, WC, LC]
    scope: [BC, WC]
    triggers:
      all_of:
        - any_of:
            - docs_present: [BC]
            - docs_present: [WC]
        - any_of:
            - lc_field_present: [documents_required]
            - lc_field_present: [additional_conditions]
    lc_fields_required: []
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-a, UCP-14-f]
    isbp_refs: [ISBP-Q1, ISBP-Q3]
    field_keys: [documents_required, additional_conditions, bc_conditions_text, wc_conditions_text, wc_scope, wc_period]
    enabled: true

  # ---------------------------------------------------------------------------
  # COND-47A · :47A: Additional conditions — AGENTIC (sub_results aggregate)
  # ---------------------------------------------------------------------------
  # One catalog rule. Internally produces N condition_results, each with its own
  # verdict / severity / source_text / citations. Worklist row is parent;
  # condition_results render as expandable sub-rows. Override may target the
  # parent (cascades) or a specific child via target = "COND-47A#<condition_id>".
  - rule_id: COND-47A
    name: "Additional conditions (:47A:) compliance"
    version: 1
    canonical_field: additional_conditions
    applies_to: [LC, INV, BOL, PKL, BOE, BC, WC]
    scope: [INV, BOL, PKL, BOE, BC, WC]
    triggers:
      all_of:
        - lc_field_present: [additional_conditions]
    lc_fields_required: [additional_conditions]
    check_type: AGENTIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-a, UCP-14-d]
    isbp_refs: [ISBP-A1, ISBP-A19]
    field_keys: [additional_conditions, documents_required]
    enabled: true
    max_iterations: 6
    execution_strategy: structured_output

  # ---------------------------------------------------------------------------
  # CERT-02 · Certificate signature and form requirements (BC + WC) — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: CERT-02
    name: Certificate signature and form requirements
    version: 1
    canonical_field: signature_party
    applies_to: [BC, WC, LC]
    scope: [BC, WC]
    triggers:
      all_of:
        - any_of:
            - docs_present: [BC]
            - docs_present: [WC]
    lc_fields_required: []
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: []
    isbp_refs: [ISBP-A12, ISBP-Q3]
    field_keys: [documents_required, additional_conditions, signed, signature_party, stamp_present]
    enabled: true
