# =============================================================================
# catalog.yml — v2 rule catalog (20 rules, topic-prefix IDs)
# =============================================================================
#
# Topic-prefix scheme: CCY · AMT · DATE · PARTY · GOODS · SHIP · DOC · COND
# Execution tiers (check_type):
#   PROGRAMMATIC — SpEL expression on #lc / #docs / #presentationDate
#   AGENT        — single ChatClient call, structured JSON
#   AGENT_TOOL   — ChatClient + ExamineToolRegistry, single round
#   AGENTIC      — Tool-calling reasoning loop (≤ max_iterations)
#
# Tier defaults (applied by RuleCatalogRegistry if a rule omits them):
#   AGENTIC      → thinking_enabled=true, max_iterations=4
#   AGENT_TOOL   → thinking_enabled=false
#   AGENT        → thinking_enabled=false
#
# Rule fields (snake_case — Jackson SNAKE_CASE):
#   rule_id              Topic-prefix + 2-digit (^(CCY|AMT|DATE|PARTY|GOODS|SHIP|DOC|COND)-\d{2}$)
#   name                 Human-readable display label
#   version              Semantic version (bump on logic change)
#   check_type           PROGRAMMATIC | AGENT | AGENT_TOOL | AGENTIC
#   applies_to / scope   Doc types this rule examines
#   trigger_docs         Legacy fallback list of required doc types
#   triggers             Compound trigger DSL
#   lc_fields_required   Required LC fields; if any absent → NOT_APPLICABLE (flipped to FAIL by stage)
#   severity             CRITICAL | MAJOR | MINOR
#   polarity             POSITIVE | NEGATIVE
#   waivable             Whether discrepancy can be waived via Art. 16(b)
#   ucp_refs / isbp_refs Citation IDs in refs/{ucp600,isbp821}.yaml
#   ucp_excerpt          Quoted UCP/ISBP text injected into the LLM prompt
#   expression           SpEL for PROGRAMMATIC; null for LLM tiers
#   prompt_instruction   Per-rule LLM instruction; loaded from prompts/check/<rule_id>.st on miss
#   field_keys           Fields injected into LLM prompt context
#   thinking_enabled     Per-rule override of enable_thinking
#   max_iterations       AGENTIC convergence cap

rules:

  # ============================================================================
  # TIER 1 · PROGRAMMATIC — deterministic SpEL field comparison
  # ============================================================================


  # ---------------------------------------------------------------------------
  # AMT-02 · Draft amount equals invoice amount — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: AMT-02
    name: Draft amount equals invoice amount
    version: 1
    canonical_field: amount
    applies_to: [BOE, INV]
    scope: [BOE, INV]
    trigger_docs: [BOE]
    triggers:
      all_of:
        - docs_present: [BOE]
        - docs_present: [INV]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-18-b]
    isbp_refs: [ISBP-B3]
    ucp_excerpt: |
      UCP 600 Art. 18(b): The amount of a commercial invoice must not exceed the amount permitted by the credit.
      ISBP 821 B3: The amount of a draft must correspond to the amount shown in the commercial invoice.
    field_keys: [draft_amount, invoice_total]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).amountsEqual(
        #docs['BOE']?.get('draft_amount'), #docs['INV']?.get('invoice_total'))
    enabled: true

  - rule_id: CCY-01
    name: Currency consistent across LC, invoice, and draft
    version: 1
    canonical_field: currency
    applies_to: [LC, INV, BOE]
    scope: [INV, BOE]
    trigger_docs: [INV]
    triggers:
      all_of:
        - any_of:
            - docs_present: [INV]
            - docs_present: [BOE]
        - lc_field_present: [credit_currency]
    lc_fields_required: [credit_currency]
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-18-a-3, UCP-18-b]
    isbp_refs: [ISBP-C8, ISBP-B3]
    ucp_excerpt: |
      UCP 600 Art. 18(a)(iii): A commercial invoice must be made out in the currency of the credit.
      UCP 600 Art. 18(b): The amount of a commercial invoice must not exceed the amount permitted by the credit.
      ISBP 821 C8: The invoice must be in the same currency as the credit. ISO 4217 codes and currency symbols are acceptable.
      ISBP 821 B3: The amount of a draft must correspond to the amount shown in the commercial invoice.
    field_keys: [credit_currency, draft_currency]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).currencyConsistent(
        #docs, #lc['credit_currency'])
    enabled: true


  # ---------------------------------------------------------------------------
  # DATE-01 · No document dated after presentation — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: DATE-01
    name: No document dated later than presentation date
    version: 1
    canonical_field: document_date
    applies_to: [INV, BOL, PKL, BOE, BC, WC]
    scope: [INV, BOL, PKL, BOE, BC, WC]
    trigger_docs: [INV]
    triggers:
      any_of:
        - docs_present: [INV]
        - docs_present: [BOL]
        - docs_present: [PKL]
        - docs_present: [BOE]
        - docs_present: [BC]
        - docs_present: [WC]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-14-h, UCP-14-i]
    isbp_refs: [ISBP-A19]
    ucp_excerpt: |
      UCP 600 Art. 14(i): A document may be dated prior to the issuance date of the credit, but must not be dated
        later than its date of presentation.
      ISBP 821 A19: A document may be dated prior to the date of the credit but must not be dated later than the
        date of its presentation. Dates may be expressed in any unambiguous format.
    field_keys: [document_date, invoice_date, bl_date, pkl_date, boe_date, bc_date, wc_date]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).docDatesValid(
        #docs, T(java.time.LocalDate).parse(#presentationDate))
    enabled: true


  # ---------------------------------------------------------------------------
  # DOC-01 · Full set of B/L originals presented — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: DOC-01
    name: Full set of B/L originals presented
    version: 1
    canonical_field: originals
    applies_to: [BOL]
    scope: [BOL]
    trigger_docs: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-17, UCP-20-a-4]
    isbp_refs: [ISBP-D7]
    ucp_excerpt: |
      UCP 600 Art. 17: At least one original of each document stipulated in the credit must be presented.
      UCP 600 Art. 20(a)(iv): A bill of lading must be the sole original bill of lading or, if issued in more
        than one original, be the full set as indicated on the bill of lading.
      ISBP 821 D7: When a bill of lading indicates the number of originals issued, the full set must be presented.
    field_keys: [originals_presented, originals_required]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).fullSetPresented(#docs['BOL'])
    enabled: true


  # ---------------------------------------------------------------------------
  # DOC-03 · Beneficiary cert signed when LC requires — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  # DISABLED — gate misfires "FAIL" when LC has no signature requirement (should be PASS/NA)
  - rule_id: DOC-03
    name: Beneficiary certificate signed when LC requires signature
    version: 1
    canonical_field: signature
    applies_to: [LC, BC]
    scope: [BC]
    trigger_docs: [BC]
    triggers:
      all_of:
        - docs_present: [BC]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-3]
    isbp_refs: [ISBP-Q3, ISBP-A12]
    ucp_excerpt: |
      UCP 600 Art. 3: Documents may be signed by handwriting, facsimile signature, perforated signature, stamp,
        symbol, or any other mechanical or electronic method of authentication.
      ISBP 821 Q3: Where a credit requires a certificate to be signed, it must bear what appears to be a
        handwritten or authenticated signature. A stamp or seal alone does not constitute a signature.
      ISBP 821 A12: A signature need not be handwritten.
    field_keys: [bc_signature_present, bc_certifying_party]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).bcSignaturePresentIfRequired(
        #docs['BC'], #lc)
    enabled: false


  # ---------------------------------------------------------------------------
  # GOODS-02 · Quantity consistent: invoice ↔ packing list — PROGRAMMATIC
  # (covers former PKL-003 and XD-004)
  # ---------------------------------------------------------------------------
  - rule_id: GOODS-02
    name: Quantity / packages consistent between invoice and packing list
    version: 1
    canonical_field: quantity
    applies_to: [INV, PKL]
    scope: [INV, PKL]
    trigger_docs: [INV, PKL]
    triggers:
      all_of:
        - docs_present: [INV]
        - docs_present: [PKL]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-14-d]
    isbp_refs: [ISBP-M1, ISBP-C11]
    ucp_excerpt: |
      UCP 600 Art. 14(d): Data in a document need not be identical to, but must not conflict with, data in any
        other stipulated document or the credit.
      ISBP 821 M1: Quantity, weight and measures shown on a packing list must not conflict with the corresponding
        data on other stipulated documents.
    field_keys: [quantity, total_packages, total_weight]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).quantitiesConsistent(
        #docs['INV'], #docs['PKL'])
    enabled: false  # DISABLED — extraction-dependent; surfaces parse gaps as FAIL


  # ---------------------------------------------------------------------------
  # GOODS-03 · Marks consistent: packing list ↔ B/L — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: GOODS-03
    name: Shipping marks consistent between packing list and B/L
    version: 1
    canonical_field: shipping_marks
    applies_to: [PKL, BOL]
    scope: [PKL, BOL]
    trigger_docs: [PKL, BOL]
    triggers:
      all_of:
        - docs_present: [PKL]
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: MINOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-d]
    isbp_refs: [ISBP-M2]
    ucp_excerpt: |
      UCP 600 Art. 14(d): Data must not conflict with data in any other stipulated document.
      ISBP 821 M2: Shipping marks on a packing list and a transport document must not conflict.
    field_keys: [shipping_marks]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).marksConsistent(
        #docs['PKL']?.get('shipping_marks'), #docs['BOL']?.get('shipping_marks'))
    enabled: false  # DISABLED — extraction-dependent; PKL/BOL marks rarely both present


  # ---------------------------------------------------------------------------
  # PARTY-01 · Invoice issued by the beneficiary — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: PARTY-01
    name: Invoice issued by the beneficiary
    version: 1
    canonical_field: beneficiary_name
    applies_to: [LC, INV]
    scope: [INV]
    trigger_docs: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
        - lc_field_present: [beneficiary_name]
    lc_fields_required: [beneficiary_name]
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-18-a-1]
    isbp_refs: [ISBP-C6]
    ucp_excerpt: |
      UCP 600 Art. 18(a)(i): A commercial invoice must appear to have been issued by the beneficiary.
      ISBP 821 C6: An invoice must indicate the name and address of the beneficiary as in the credit. Variations
        such as Ltd. for Limited are acceptable.
    field_keys: [beneficiary_name, invoice_issuer]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).namesEqual(
        #docs['INV']?.get('invoice_issuer'), #lc['beneficiary_name'])
    enabled: false  # DISABLED — invoice_issuer rarely extracted; PARTY-02 (AGENTIC) covers cross-doc beneficiary


  # ---------------------------------------------------------------------------
  # PARTY-03 · Draft drawn on party stated in LC — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: PARTY-03
    name: Draft drawn on the drawee named in the credit
    version: 1
    canonical_field: drawee_name
    applies_to: [LC, BOE]
    scope: [BOE]
    trigger_docs: [BOE]
    triggers:
      all_of:
        - docs_present: [BOE]
        - lc_field_present: [drawee_name]
    lc_fields_required: [drawee_name]
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-6-a]
    isbp_refs: [ISBP-B1]
    ucp_excerpt: |
      UCP 600 Art. 6(a): A credit must state the bank with which it is available.
      ISBP 821 B1: A draft must be drawn on the drawee named in the credit.
    field_keys: [drawee_name]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).namesEqual(
        #docs['BOE']?.get('drawee_name'), #lc['drawee_name'])
    enabled: false  # DISABLED — gate-trace surfaces "FAIL" when drawee_name absent in MT700; should be NA


  # ---------------------------------------------------------------------------
  # SHIP-01 · B/L shows on-board notation — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: SHIP-01
    name: B/L bears on-board notation (or is pre-printed shipped on board)
    version: 1
    canonical_field: onboard_notation
    applies_to: [LC, BOL]
    scope: [BOL]
    trigger_docs: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-20-a-2]
    isbp_refs: [ISBP-D20]
    ucp_excerpt: |
      UCP 600 Art. 20(a)(ii): A bill of lading must indicate that the goods have been shipped on board a named
        vessel at the port of loading stated in the credit, by pre-printed wording or by an on board notation
        indicating the date on which the goods have been shipped on board.
      ISBP 821 D20: When a bill of lading is not pre-printed "shipped on board", an on board notation is required.
        The on board notation must be dated, and the date is treated as the date of shipment.
    field_keys: [onboard_notation, shipment_date, bl_date]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).onBoardNotationPresent(
        #docs['BOL'])
    enabled: true


  # ---------------------------------------------------------------------------
  # SHIP-02 · B/L ports of loading and discharge correct — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: SHIP-02
    name: B/L ports of loading and discharge match LC
    version: 1
    canonical_field: ports
    applies_to: [LC, BOL]
    scope: [BOL]
    trigger_docs: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
        - any_of:
            - lc_field_present: [port_of_loading]
            - lc_field_present: [port_of_discharge]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-20-a-3]
    isbp_refs: [ISBP-D21]
    ucp_excerpt: |
      UCP 600 Art. 20(a)(iii): A bill of lading must indicate the port of loading and the port of discharge as
        stated in the credit.
      ISBP 821 D21: A bill of lading must show the port of loading and port of discharge as stated in the credit.
    field_keys: [port_of_loading, port_of_discharge]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).portsMatch(
        #docs['BOL'], #lc['port_of_loading'], #lc['port_of_discharge'])
    enabled: true


  # ---------------------------------------------------------------------------
  # SHIP-03 · Incoterms consistent with B/L freight notation — PROGRAMMATIC
  # ---------------------------------------------------------------------------
  - rule_id: SHIP-03
    name: Invoice Incoterms consistent with B/L freight notation
    version: 1
    canonical_field: incoterms
    applies_to: [INV, BOL]
    scope: [INV, BOL]
    trigger_docs: [INV, BOL]
    triggers:
      all_of:
        - docs_present: [INV]
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: PROGRAMMATIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-14-d]
    isbp_refs: [ISBP-C12]
    ucp_excerpt: |
      UCP 600 Art. 14(d): Data must not conflict.
      ISBP 821 C12: An invoice showing CFR/CIF must be supported by a transport document showing freight prepaid;
        an invoice showing FOB must be supported by a freight-collect transport document.
    field_keys: [incoterms, freight_notation]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).incotermsFreightConsistent(
        #docs['INV']?.get('incoterms'), #docs['BOL']?.get('freight_notation'))
    enabled: false  # DISABLED — freight_notation rarely extracted from BOL


  # ============================================================================
  # TIER 2 · AGENT — single ChatClient call, structured JSON
  # ============================================================================


  # ---------------------------------------------------------------------------
  # COND-01 · Beneficiary cert satisfies :46A: conditions — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: COND-01
    name: "Beneficiary certificate satisfies all :46A: / :47A: conditions"
    version: 1
    canonical_field: certificate_compliance
    applies_to: [LC, BC]
    scope: [BC]
    trigger_docs: [BC]
    triggers:
      all_of:
        - docs_present: [BC]
        - any_of:
            - lc_field_present: [documents_required]
            - lc_field_present: [additional_conditions]
    lc_fields_required: []
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-f]
    isbp_refs: [ISBP-Q1, ISBP-Q2, ISBP-Q3, ISBP-Q4, ISBP-Q5]
    ucp_excerpt: |
      UCP 600 Art. 14(f): For documents not specified in the credit, banks will accept the document as presented
        if its content appears to fulfil the function of the required document.
      ISBP 821 Q1: Where a credit requires a certificate or declaration, every condition or requirement stated in
        the credit for that certificate must be addressed in the document.
      ISBP 821 Q2: A certificate must be issued by the entity stated in the credit.
      ISBP 821 Q3: A signed certificate must bear a handwritten or authenticated signature.
      ISBP 821 Q4: References to other documents (numbers/dates) must match.
      ISBP 821 Q5: Data must not conflict with other stipulated documents or the credit.
    field_keys: [documents_required, additional_conditions, bc_conditions_text, bc_certifying_party]
    enabled: true


  # ---------------------------------------------------------------------------
  # COND-02 · Warranty cert satisfies :46A: conditions — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: COND-02
    name: "Warranty certificate satisfies all :46A: / :47A: conditions"
    version: 1
    canonical_field: certificate_compliance
    applies_to: [LC, WC]
    scope: [WC]
    trigger_docs: [WC]
    triggers:
      all_of:
        - docs_present: [WC]
        - any_of:
            - lc_field_present: [documents_required]
            - lc_field_present: [additional_conditions]
    lc_fields_required: []
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucp_refs: [UCP-14-f]
    isbp_refs: [ISBP-Q1, ISBP-Q2, ISBP-Q5]
    ucp_excerpt: |
      UCP 600 Art. 14(f): For documents not specified in the credit, banks will accept the document as presented
        if its content appears to fulfil the function of the required document.
      ISBP 821 Q1: Every condition stated in the credit for the certificate must be addressed in the document.
      ISBP 821 Q2: A certificate must be issued by the entity stated in the credit.
      ISBP 821 Q5: Data must not conflict with other stipulated documents or the credit.
    field_keys: [documents_required, additional_conditions, wc_conditions_text, wc_scope, wc_period]
    enabled: false  # DISABLED — COND-01 (BC) already demonstrates the AGENT cert-compliance pattern

  # ---------------------------------------------------------------------------
  # DOC-05 · Invoice quotes LC number when :46A: requires it — AGENT
  # (ported from v1 ISBP-C1; v1 prompt cleaned up for v2's inlined-context flow)
  # ---------------------------------------------------------------------------
  - rule_id: DOC-05
    name: "Invoice quotes the LC number when :46A: requires it"
    version: 1
    canonical_field: lc_number_reference
    applies_to: [LC, INV]
    scope: [INV]
    trigger_docs: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
        - lc_field_present: [lc_number]
    lc_fields_required: [lc_number]
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-18-a-1]
    isbp_refs: [ISBP-C1]
    ucp_excerpt: |
      UCP 600 Art. 18(a)(i): A commercial invoice must appear to have been issued by the beneficiary.
      ISBP 821 C1: If the LC requires the invoice to bear the credit number, failure to state it is a
        discrepancy; if not required, the invoice may optionally state the LC number.
    field_keys: [lc_number, documents_required, additional_conditions, invoice_lc_reference]
    enabled: true


  # ---------------------------------------------------------------------------
  # DOC-02 · B/L is clean (no defect/damage clauses) — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: DOC-02
    name: B/L is clean (no defect or damage clauses)
    version: 1
    canonical_field: clean_indicator
    applies_to: [BOL]
    scope: [BOL]
    trigger_docs: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: AGENT
    severity: MAJOR
    polarity: NEGATIVE
    waivable: true
    ucp_refs: [UCP-27]
    isbp_refs: [ISBP-D25]
    ucp_excerpt: |
      UCP 600 Art. 27: A bank will only accept a clean transport document. A clean transport document is one
        bearing no clause or notation expressly declaring a defective condition of the goods or their packaging.
        The word "clean" need not appear on a transport document.
      ISBP 821 D25: A transport document bearing a clause expressly declaring a defective condition of the goods
        or packaging is not acceptable. Clauses such as "shipper's load and count" or "said by shipper to contain"
        are acceptable.
    field_keys: [clean_indicator]
    enabled: true


  # ---------------------------------------------------------------------------
  # DOC-04 · Documents comply on face with LC terms (general) — AGENT
  # ---------------------------------------------------------------------------
  - rule_id: DOC-04
    name: Documents comply on face with LC terms (general)
    version: 1
    canonical_field: documents_required
    applies_to: [LC, INV, BOL, PKL, BOE, BC, WC]
    scope: [INV, BOL, PKL, BOE, BC, WC]
    trigger_docs: []
    triggers:
      any_of:
        - docs_present: [INV]
        - docs_present: [BOL]
        - docs_present: [PKL]
        - docs_present: [BOE]
        - docs_present: [BC]
        - docs_present: [WC]
    lc_fields_required: []
    check_type: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    ucp_refs: [UCP-14-a, UCP-14-f]
    isbp_refs: [ISBP-A1]
    ucp_excerpt: |
      UCP 600 Art. 14(a): Documents must be examined on their face to determine whether they appear to constitute
        a complying presentation.
      UCP 600 Art. 14(f): If a credit requires presentation of a document other than a transport document,
        insurance document or commercial invoice, without stipulating by whom the document is to be issued or
        its data content, banks will accept the document as presented if its content appears to fulfil the
        function of the required document.
      ISBP 821 A1: Examination of documents under a documentary credit requires a careful reading of the credit
        and the documents presented. Documents are to be examined in their entirety.
    field_keys: []
    enabled: false  # DISABLED — empty field_keys gives the LLM no doc context, returns "data missing"


  # ============================================================================
  # TIER 3 · AGENT_TOOL — ChatClient + ExamineToolRegistry, single round
  # ============================================================================


  # ---------------------------------------------------------------------------
  # AMT-01 · Invoice amount within LC (with :39A: tolerance) — AGENT_TOOL
  # ---------------------------------------------------------------------------
  - rule_id: AMT-01
    name: "Invoice amount within LC (respecting :39A: tolerance)"
    version: 1
    canonical_field: amount
    applies_to: [LC, INV]
    scope: [INV]
    trigger_docs: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
        - lc_field_present: [credit_amount, credit_currency]
    lc_fields_required: [credit_amount, credit_currency]
    check_type: AGENT_TOOL
    severity: CRITICAL
    polarity: NEGATIVE
    waivable: false
    max_iterations: 2
    ucp_refs: [UCP-18-b, UCP-30-a, UCP-30-b, UCP-30-c]
    isbp_refs: [ISBP-C9, ISBP-C10]
    ucp_excerpt: |
      UCP 600 Art. 18(b): The amount of a commercial invoice must not exceed the amount permitted by the credit.
      UCP 600 Art. 30(a): The words "about" or "approximately" used in connection with the amount of the credit
        or the quantity or the unit price are to be construed as allowing a tolerance not to exceed 10% more
        or 10% less than the amount, the quantity or the unit price to which they refer.
      UCP 600 Art. 30(b): A tolerance not to exceed 5% more or 5% less than the quantity of the goods is allowed,
        provided the credit does not state the quantity in terms of a stipulated number of packing units or
        individual items and the total amount of the drawings does not exceed the amount of the credit.
      UCP 600 Art. 30(c): Even when partial shipments are not allowed, a tolerance not to exceed 5% less than
        the amount of the credit is allowed, provided the quantity is shipped in full and unit price is not reduced.
      ISBP 821 C9: The invoice amount must not exceed the credit amount, taking into account permitted tolerances.
      ISBP 821 C10: Tolerances under UCP 600 sub-article 30(b) apply to the invoice amount even when not expressly stated.
    field_keys: [credit_amount, credit_currency, about_credit_amount, tolerance_plus, tolerance_minus, invoice_total]
    enabled: true


  # ---------------------------------------------------------------------------
  # AMT-03 · Invoice header arithmetic (qty × unit_price ≈ total) — AGENT_TOOL
  # (ported from v1 UCP-18b-math; uses verify_arithmetic compute tool)
  # ---------------------------------------------------------------------------
  - rule_id: AMT-03
    name: Invoice header arithmetic (qty × unit price reconciles to total)
    version: 1
    canonical_field: amount_math
    applies_to: [INV]
    scope: [INV]
    trigger_docs: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
    lc_fields_required: []
    check_type: AGENT_TOOL
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    max_iterations: 2
    ucp_refs: [UCP-18-b]
    isbp_refs: []
    ucp_excerpt: |
      UCP 600 Art. 18(b): The amount of a commercial invoice must not exceed the amount permitted
        by the credit. Internal invoice arithmetic must reconcile so the documentary face value is
        unambiguous (qty × unit price ≈ total, within rounding tolerance).
    field_keys: [quantity, unit_price, invoice_total, credit_amount]
    enabled: true


  # ---------------------------------------------------------------------------
  # DATE-02 · Presentation within window of B/L on-board date — AGENT_TOOL
  # ---------------------------------------------------------------------------
  - rule_id: DATE-02
    name: Presentation within 21 days of shipment and before LC expiry
    version: 1
    canonical_field: presentation_window
    applies_to: [LC, BOL]
    scope: [BOL]
    trigger_docs: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lc_fields_required: []
    check_type: AGENT_TOOL
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    max_iterations: 2
    ucp_refs: [UCP-14-c]
    isbp_refs: []
    ucp_excerpt: |
      UCP 600 Art. 14(c): A presentation including one or more original transport documents subject to articles
        19, 20, 21, 22, 23, 24 or 25 must be made by or on behalf of the beneficiary not later than 21 calendar
        days after the date of shipment, but in any event not later than the expiry date of the credit.
    field_keys: [shipment_date, bl_date, expiry_date, presentation_days]
    enabled: false  # DISABLED — returns DOUBTS with empty explanation; tool reliability low


  # ============================================================================
  # TIER 4 · AGENTIC — tool-calling reasoning loop (≤ max_iterations)
  # ============================================================================


  # ---------------------------------------------------------------------------
  # GOODS-01 · Invoice goods description corresponds to :45A: — AGENTIC
  # ---------------------------------------------------------------------------
  - rule_id: GOODS-01
    name: "Invoice goods description corresponds to LC :45A:"
    version: 1
    canonical_field: goods_description
    applies_to: [LC, INV, BOL, PKL]
    scope: [INV, BOL, PKL]
    trigger_docs: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
        - lc_field_present: [goods_description]
    lc_fields_required: [goods_description]
    check_type: AGENTIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    thinking_enabled: true
    max_iterations: 6
    ucp_refs: [UCP-18-c, UCP-14-e]
    isbp_refs: [ISBP-C3]
    ucp_excerpt: |
      UCP 600 Art. 18(c): The description of the goods, services or performance in a commercial invoice must
        correspond with that appearing in the credit.
      UCP 600 Art. 14(e): In documents other than the commercial invoice, the description of the goods, services
        or performance, if stated, may be in general terms not conflicting with their description in the credit.
      ISBP 821 C3: The description of goods in the invoice must correspond with the description in the credit.
        Word-for-word identity is not required, but the description must not conflict with the credit.
    field_keys: [goods_description, line_items, incoterms]
    enabled: true


  # ---------------------------------------------------------------------------
  # PARTY-02 · Beneficiary name consistent across all docs — AGENTIC
  # ---------------------------------------------------------------------------
  - rule_id: PARTY-02
    name: Beneficiary name consistent across all submitted documents
    version: 1
    canonical_field: beneficiary_name
    applies_to: [LC, INV, BOL, BC, WC]
    scope: [INV, BOL, BC, WC]
    trigger_docs: [INV]
    triggers:
      all_of:
        - any_of:
            - docs_present: [INV]
            - docs_present: [BOL]
            - docs_present: [BC]
            - docs_present: [WC]
        - lc_field_present: [beneficiary_name]
    lc_fields_required: [beneficiary_name]
    check_type: AGENTIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    thinking_enabled: true
    max_iterations: 6
    ucp_refs: [UCP-14-d, UCP-14-a]
    isbp_refs: [ISBP-A23, ISBP-A14, ISBP-A15]
    ucp_excerpt: |
      UCP 600 Art. 14(a): Documents must be examined on their face to determine whether they appear to constitute
        a complying presentation.
      UCP 600 Art. 14(d): Data in a document, when read in context with the credit, the document itself and
        international standard banking practice, need not be identical to, but must not conflict with, data in
        that document, any other stipulated document or the credit.
      ISBP 821 A14: Internationally accepted abbreviations are acceptable: Ltd., Co., Corp., Int'l, Mfg., St., Ave., Rd.
      ISBP 821 A15: A misspelling or typing error that does not affect the meaning of a word does not make a
        document discrepant. "Indusrial" for "Industrial" is fine; "Model 123" vs "Model 321" is NOT.
      ISBP 821 A23: The beneficiary's name on documents need not match exactly so long as variations do not
        create a different legal entity.
    field_keys: [beneficiary_name]
    enabled: true


  # ---------------------------------------------------------------------------
  # COND-03 · :47A: additional conditions satisfied across presentation — AGENTIC
  # ---------------------------------------------------------------------------
  # Decomposes :47A: into atomic clauses, classifies the target doc(s) for each,
  # and probes those docs via tools. Complements COND-01/COND-02 (which only
  # cover BC/WC) and DOC-04 (too generic to enumerate :47A: clauses).
  - rule_id: COND-03
    name: ":47A: additional conditions satisfied across presented documents"
    version: 1
    canonical_field: additional_conditions
    applies_to: [LC, INV, BOL, PKL, BOE, BC, WC]
    scope: [INV, BOL, PKL, BOE, BC, WC]
    trigger_docs: []
    triggers:
      all_of:
        - lc_field_present: [additional_conditions]
        - any_of:
            - docs_present: [INV]
            - docs_present: [BOL]
            - docs_present: [PKL]
            - docs_present: [BOE]
            - docs_present: [BC]
            - docs_present: [WC]
    lc_fields_required: [additional_conditions]
    check_type: AGENTIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    thinking_enabled: true
    max_iterations: 6
    ucp_refs: [UCP-14-a, UCP-14-d, UCP-14-f, UCP-14-h]
    isbp_refs: [ISBP-A1, ISBP-Q1, ISBP-Q5]
    ucp_excerpt: |
      UCP 600 Art. 14(a): Documents must be examined on their face to determine whether they appear to constitute
        a complying presentation.
      UCP 600 Art. 14(d): Data in a document, when read in context with the credit, the document itself and
        international standard banking practice, need not be identical to, but must not conflict with, data in
        that document, any other stipulated document or the credit.
      UCP 600 Art. 14(f): If a credit requires presentation of a document other than a transport document,
        insurance document or commercial invoice, without stipulating by whom the document is to be issued or
        its data content, banks will accept the document as presented if its content appears to fulfil the
        function of the required document.
      UCP 600 Art. 14(h): If a credit contains a condition without stipulating the document to indicate compliance
        with the condition, banks will deem such condition as not stated and will disregard it.
      ISBP 821 A1: Examination of documents requires careful reading of the credit and the documents presented.
      ISBP 821 Q1: Every condition stated in the credit must be addressed in the relevant document.
      ISBP 821 Q5: Data must not conflict with other stipulated documents or the credit.
    field_keys: [additional_conditions, documents_required]
    enabled: false  # DISABLED — degenerates to "all docs are in English"; not a meaningful conditions check
