# =============================================================================
# catalog.yml — v2 POC rule catalog (10 consolidated operations)
# =============================================================================
#
# This is a POC catalog calibrated to industry reality. Banks run 30-50 rules
# in production; this 10-op set covers ~70% of real discrepancies seen on the
# four test bundles and exercises all four checkType categories.
#
# +------+-----------------------------------+--------------+--------------+----------+
# |  ID  | Operation                         | Type         | Docs         | Severity |
# +------+-----------------------------------+--------------+--------------+----------+
# | OP01 | CURRENCY-CONSISTENT               | PROGRAMMATIC | INV/BOE/INS  | CRITICAL |
# | OP02 | AMOUNT-WITHIN-LC                  | AGENT_TOOL   | INV/BOE      | CRITICAL |
# | OP03 | DOC-DATE-VALID                    | PROGRAMMATIC | ALL          | MAJOR    |
# | OP04 | PRESENTATION-WINDOW               | AGENT_TOOL   | BOL          | CRITICAL |
# | OP05 | BENEFICIARY-CONSISTENT            | AGENT        | INV/BOE/BC/WC| CRITICAL |
# | OP06 | GOODS-DESCRIPTION-CORRESPONDS     | AGENT        | INV (+ANY)   | MAJOR    |
# | OP07 | BL-ONBOARD-VALID                  | AGENT        | BOL          | CRITICAL |
# | OP08 | BL-CLEAN                          | AGENT        | BOL          | MAJOR    |
# | OP09 | 46A-DOC-SET-COMPLETE              | AGENT        | session-wide | CRITICAL |
# | OP10 | BC-WC-46A-COMPLIANCE              | AGENT        | BC/WC        | MAJOR    |
# +------+-----------------------------------+--------------+--------------+----------+
#
# Per-op prompt templates live at prompts/check/<rule-id>.st (mirrors v1 pattern).
# Each AGENT/AGENT_TOOL op carries a `ucp_excerpt:` block with the actual quoted
# UCP/ISBP text — injected into the LLM prompt under "Rule excerpt" header.
# PROGRAMMATIC ops keep `expression:` inline.
#
# Rule fields:
#   rule_id:           Op ID (OPnn-NAME, uppercase, hyphenated)
#   scope:             Doc types this op evaluates (display-only)
#   triggerDocs:       Legacy fallback list of required doc types
#   triggers:          Compound trigger DSL (Triggers sealed-interface variants)
#   lcFieldsRequired:  LC fields that must be present; if any absent → NOT_APPLICABLE
#   checkType:         PROGRAMMATIC | AGENT | AGENT_TOOL | (AGENTIC_ADHOC reserved for runtime)
#   severity:          CRITICAL | MAJOR | MINOR
#   polarity:          POSITIVE | NEGATIVE
#   waivable:          Whether discrepancy can be waived via Art. 16(b)
#   ucpRefs:           Citation IDs in refs/ucp600.yaml
#   isbpRefs:          Citation IDs in refs/isbp821.yaml
#   ucp_excerpt:       Quoted UCP/ISBP text injected into the LLM prompt
#   expression:        SpEL for PROGRAMMATIC ops; #lc['k'] / #docs['T']['k'] / #presentationDate
#   fieldKeys:         Field names whose values are injected into LLM prompt context
#   enabled:           false to skip at runtime without removing from catalog
#
# Multi-doc operations: each op's triggerDocs lists the doc types it spans;
# the op produces ONE verdict + per-doc evidence inside the explanation.

rules:

  # ---------------------------------------------------------------------------
  # OP01 · CURRENCY-CONSISTENT — every currency-bearing doc agrees with LC
  # ---------------------------------------------------------------------------
  - rule_id: OP01-CURRENCY-CONSISTENT
    scope: [INV, BOE, INS]
    triggerDocs: [INV]
    triggers:
      all_of:
        - any_of:
            - docs_present: [INV]
            - docs_present: [BOE]
            - docs_present: [INS]
        - lc_field_present: [credit_currency]
    lcFieldsRequired: [credit_currency]
    checkType: PROGRAMMATIC
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucpRefs: [UCP-18-a-iii, UCP-18-b, UCP-28-f-i]
    isbpRefs: [ISBP-C8, ISBP-B3, ISBP-K4]
    ucp_excerpt: |
      UCP 600 Art. 18(a)(iii): A commercial invoice must be made out in the currency of the credit.
      UCP 600 Art. 18(b): The amount of a commercial invoice must not exceed the amount permitted by the credit.
      UCP 600 Art. 28(f)(i): An insurance document must indicate that the amount of insurance coverage is in the same currency as the credit.
      ISBP 821 C8: The invoice must be in the same currency as the credit. ISO 4217 codes and currency symbols are acceptable.
      ISBP 821 B3: The amount of a draft must correspond to the amount shown in the commercial invoice.
      ISBP 821 K4: The currency of the insurance document must be the same as the currency of the credit.
    fieldKeys: [credit_currency, draft_currency]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).currencyConsistent(
        #docs, #lc['credit_currency'])
    enabled: true

  # ---------------------------------------------------------------------------
  # OP02 · AMOUNT-WITHIN-LC — invoice (and BOE) total ≤ LC, tolerance stack
  # ---------------------------------------------------------------------------
  - rule_id: OP02-AMOUNT-WITHIN-LC
    scope: [INV, BOE]
    triggerDocs: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
        - lc_field_present: [credit_amount, credit_currency]
    lcFieldsRequired: [credit_amount, credit_currency]
    checkType: AGENT_TOOL
    severity: CRITICAL
    polarity: NEGATIVE
    waivable: false
    ucpRefs: [UCP-18-b, UCP-30-a, UCP-30-b, UCP-30-c]
    isbpRefs: [ISBP-C9, ISBP-C10]
    ucp_excerpt: |
      UCP 600 Art. 18(b): The amount of a commercial invoice must not exceed the amount permitted by the credit.
      UCP 600 Art. 30(a): The words "about" or "approximately" used in connection with the amount of the credit
        or the quantity or the unit price are to be construed as allowing a tolerance not to exceed 10% more
        or 10% less than the amount, the quantity or the unit price to which they refer.
      UCP 600 Art. 30(b): A tolerance not to exceed 5% more or 5% less than the quantity of the goods is allowed,
        provided the credit does not state the quantity in terms of a stipulated number of packing units or
        individual items and the total amount of the drawings does not exceed the amount of the credit.
      UCP 600 Art. 30(c): Even when partial shipments are not allowed, a tolerance not to exceed 5% less than
        the amount of the credit is allowed, provided the quantity is shipped in full and unit price is not reduced.
      ISBP 821 C9: The invoice amount must not exceed the credit amount, taking into account permitted tolerances.
      ISBP 821 C10: Tolerances under UCP 600 sub-article 30(b) apply to the invoice amount even when not expressly stated.
      Pitfall 03 (tolerance precedence): (1) explicit :39A: % wins; (2) ABOUT/APPROXIMATELY ⇒ ±10% on quantity AND amount;
        (3) bulk goods without unit count ⇒ quantity ±5%, amount must NOT exceed LC total; (4) default ⇒ exact, no overdraw.
    fieldKeys: [credit_amount, credit_currency, about_credit_amount, tolerance_plus, tolerance_minus, invoice_total, draft_amount]
    enabled: true

  # ---------------------------------------------------------------------------
  # OP03 · DOC-DATE-VALID — every presented doc dated ≤ presentation date
  # ---------------------------------------------------------------------------
  - rule_id: OP03-DOC-DATE-VALID
    scope: [INV, BOL, PKL, BOE, BC, WC]
    triggerDocs: [INV]
    triggers:
      any_of:
        - docs_present: [INV]
        - docs_present: [BOL]
        - docs_present: [PKL]
        - docs_present: [BOE]
        - docs_present: [BC]
        - docs_present: [WC]
    lcFieldsRequired: []
    checkType: PROGRAMMATIC
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    ucpRefs: [UCP-14-h, UCP-14-i]
    isbpRefs: [ISBP-A19]
    ucp_excerpt: |
      UCP 600 Art. 14(i): A document may be dated prior to the issuance date of the credit, but must not be dated
        later than its date of presentation.
      ISBP 821 A19: A document may be dated prior to the date of the credit but must not be dated later than the
        date of its presentation. Dates may be expressed in any unambiguous format.
    fieldKeys: [document_date, invoice_date, bl_date, pkl_date, boe_date, bc_date, wc_date]
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).docDatesValid(
        #docs, T(java.time.LocalDate).parse(#presentationDate))
    enabled: true

  # ---------------------------------------------------------------------------
  # OP04 · PRESENTATION-WINDOW — 21-day clock + LC expiry + override window
  # ---------------------------------------------------------------------------
  - rule_id: OP04-PRESENTATION-WINDOW
    scope: [BOL]
    triggerDocs: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lcFieldsRequired: []
    checkType: AGENT_TOOL
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucpRefs: [UCP-14-c]
    isbpRefs: []
    ucp_excerpt: |
      UCP 600 Art. 14(c): A presentation including one or more original transport documents subject to articles
        19, 20, 21, 22, 23, 24 or 25 must be made by or on behalf of the beneficiary not later than 21 calendar
        days after the date of shipment, but in any event not later than the expiry date of the credit.
    fieldKeys: [shipment_date, bl_date, expiry_date, presentation_days]
    enabled: true

  # ---------------------------------------------------------------------------
  # OP05 · BENEFICIARY-CONSISTENT — INV/BOE/BC/WC named beneficiary = LC :59:
  # ---------------------------------------------------------------------------
  - rule_id: OP05-BENEFICIARY-CONSISTENT
    scope: [INV, BOE, BC, WC]
    triggerDocs: [INV]
    triggers:
      all_of:
        - any_of:
            - docs_present: [INV]
            - docs_present: [BOE]
            - docs_present: [BC]
            - docs_present: [WC]
        - lc_field_present: [beneficiary_name]
    lcFieldsRequired: [beneficiary_name]
    checkType: AGENT
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucpRefs: [UCP-18-a-i, UCP-6-a, UCP-14-a]
    isbpRefs: [ISBP-B1, ISBP-C6, ISBP-Q2, ISBP-A14, ISBP-A15]
    ucp_excerpt: |
      UCP 600 Art. 18(a)(i): A commercial invoice must appear to have been issued by the beneficiary.
      UCP 600 Art. 6(a): A credit must state the bank with which it is available.
      UCP 600 Art. 14(a): Documents must be examined on their face to determine whether they appear to constitute
        a complying presentation.
      ISBP 821 B1: A draft must be drawn on the drawee named in the credit.
      ISBP 821 C6: An invoice must indicate the name and address of the beneficiary as in the credit. Variations
        such as Ltd. for Limited are acceptable.
      ISBP 821 A14: Internationally accepted abbreviations are acceptable: Ltd., Co., Corp., Int'l, Mfg., St., Ave., Rd.
      ISBP 821 A15: A misspelling or typing error that does not affect the meaning of a word does not make a
        document discrepant. "Indusrial" for "Industrial" is fine; "Model 123" vs "Model 321" is NOT.
      Pitfall 01: Non-contradictory ≠ identical. Abbreviations and minor spelling variations are NOT discrepancies.
    fieldKeys: [beneficiary_name, drawer_name, bc_certifying_party]
    enabled: true

  # ---------------------------------------------------------------------------
  # OP06 · GOODS-DESCRIPTION-CORRESPONDS — invoice strict, others general
  # ---------------------------------------------------------------------------
  - rule_id: OP06-GOODS-DESCRIPTION-CORRESPONDS
    scope: [INV, BOL, PKL, WC, INS]
    triggerDocs: [INV]
    triggers:
      all_of:
        - docs_present: [INV]
        - lc_field_present: [goods_description]
    lcFieldsRequired: [goods_description]
    checkType: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucpRefs: [UCP-18-c, UCP-14-e]
    isbpRefs: [ISBP-C3, ISBP-A12]
    ucp_excerpt: |
      UCP 600 Art. 18(c): The description of the goods, services or performance in a commercial invoice must
        correspond with that appearing in the credit.
      UCP 600 Art. 14(e): In documents other than the commercial invoice, the description of the goods, services
        or performance, if stated, may be in general terms not conflicting with their description in the credit.
      ISBP 821 C3: The description of goods in the invoice must correspond with the description in the credit.
        Word-for-word identity is not required, but the description must not conflict with the credit.
      ISBP 821 A12: A signature need not be handwritten.
      Pitfall 01: Non-contradictory ≠ identical.
    fieldKeys: [goods_description, line_items, incoterms]
    enabled: true

  # ---------------------------------------------------------------------------
  # OP07 · BL-ONBOARD-VALID — on-board notation + LC port match + intended override
  # ---------------------------------------------------------------------------
  - rule_id: OP07-BL-ONBOARD-VALID
    scope: [BOL]
    triggerDocs: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lcFieldsRequired: []
    checkType: AGENT
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucpRefs: [UCP-20-a-ii, UCP-20-a-iii]
    isbpRefs: [ISBP-D20, ISBP-D21]
    ucp_excerpt: |
      UCP 600 Art. 20(a)(ii): A bill of lading must indicate that the goods have been shipped on board a named
        vessel at the port of loading stated in the credit, by pre-printed wording or by an on board notation
        indicating the date on which the goods have been shipped on board.
      UCP 600 Art. 20(a)(iii): A bill of lading must indicate the port of loading and the port of discharge as
        stated in the credit.
      ISBP 821 D20: When a bill of lading is not pre-printed "shipped on board", an on board notation is required.
        The on board notation must be dated, and the date is treated as the date of shipment.
      ISBP 821 D21: A bill of lading must show the port of loading and port of discharge as stated in the credit.
        If "intended" port is shown, an on board notation must confirm the actual port and date.
    fieldKeys: [onboard_notation, shipment_date, bl_date, port_of_loading, port_of_discharge]
    enabled: true

  # ---------------------------------------------------------------------------
  # OP08 · BL-CLEAN — no defect/damage notation (NEGATIVE polarity)
  # ---------------------------------------------------------------------------
  - rule_id: OP08-BL-CLEAN
    scope: [BOL]
    triggerDocs: [BOL]
    triggers:
      all_of:
        - docs_present: [BOL]
    lcFieldsRequired: []
    checkType: AGENT
    severity: MAJOR
    polarity: NEGATIVE
    waivable: true
    ucpRefs: [UCP-27]
    isbpRefs: [ISBP-D25]
    ucp_excerpt: |
      UCP 600 Art. 27: A bank will only accept a clean transport document. A clean transport document is one
        bearing no clause or notation expressly declaring a defective condition of the goods or their packaging.
        The word "clean" need not appear on a transport document.
      ISBP 821 D25: A transport document bearing a clause expressly declaring a defective condition of the goods
        or packaging is not acceptable. Clauses such as "shipper's load and count" or "said by shipper to contain"
        are acceptable.
    fieldKeys: [clean_indicator]
    enabled: true

  # ---------------------------------------------------------------------------
  # OP09 · 46A-DOC-SET-COMPLETE — all required docs present + originals counts
  # ---------------------------------------------------------------------------
  - rule_id: OP09-46A-DOC-SET-COMPLETE
    scope: [ALL]
    triggerDocs: []
    triggers:
      all_of:
        - lc_field_present: [documents_required]
    lcFieldsRequired: [documents_required]
    checkType: AGENT
    severity: CRITICAL
    polarity: POSITIVE
    waivable: false
    ucpRefs: [UCP-14-f, UCP-17]
    isbpRefs: [ISBP-A1, ISBP-A27, ISBP-A28]
    ucp_excerpt: |
      UCP 600 Art. 14(f): If a credit requires presentation of a document other than a transport document,
        insurance document or commercial invoice, without stipulating by whom the document is to be issued or
        its data content, banks will accept the document as presented if its content appears to fulfil the
        function of the required document and otherwise complies with sub-article 14(a).
      UCP 600 Art. 17: At least one original of each document stipulated in the credit must be presented.
      ISBP 821 A1: Examination of documents under a documentary credit requires a careful reading of the credit
        and the documents presented. Documents are to be examined in their entirety.
      ISBP 821 A27: A document indicated to be in "original" must be presented as such, even if not specifically
        called for.
      ISBP 821 A28: When a credit requires copies of documents, presentation of either originals or copies is
        permitted, unless the credit prohibits originals.
    fieldKeys: [documents_required, originals_required, originals_presented]
    enabled: true

  # ---------------------------------------------------------------------------
  # OP10 · BC-WC-46A-COMPLIANCE — certificates satisfy every :46A:/:47A: condition
  # ---------------------------------------------------------------------------
  - rule_id: OP10-BC-WC-46A-COMPLIANCE
    scope: [BC, WC]
    triggerDocs: [BC]
    triggers:
      all_of:
        - any_of:
            - docs_present: [BC]
            - docs_present: [WC]
        - any_of:
            - lc_field_present: [documents_required]
            - lc_field_present: [additional_conditions]
    lcFieldsRequired: []
    checkType: AGENT
    severity: MAJOR
    polarity: POSITIVE
    waivable: true
    ucpRefs: [UCP-14-f]
    isbpRefs: [ISBP-Q1, ISBP-Q2, ISBP-Q3, ISBP-Q4, ISBP-Q5]
    ucp_excerpt: |
      UCP 600 Art. 14(f): For documents not specified in the credit, banks will accept the document as presented
        if its content appears to fulfil the function of the required document.
      ISBP 821 Q1: Where a credit requires a certificate or declaration, every condition or requirement stated in
        the credit for that certificate must be addressed in the document.
      ISBP 821 Q2: A certificate must be issued by the entity stated in the credit. If no issuer is stated, the
        document may be issued by any party.
      ISBP 821 Q3: Where a credit requires a certificate to be signed, it must bear what appears to be a
        handwritten or authenticated signature. A stamp or seal alone does not constitute a signature.
      ISBP 821 Q4: Where a certificate references another document by number or date, those references must match
        the corresponding documents.
      ISBP 821 Q5: Data in a certificate must not conflict with data in any other stipulated document or the credit.
      Pitfall 11: Conditions in :46A:/:47A: must be satisfied EXACTLY — timeframe wording, scope, and any referenced
        document numbers must match. "Within 5 days" ≠ "within 7 days".
    fieldKeys: [documents_required, additional_conditions, bc_conditions_text, wc_conditions_text, bc_certifying_party, wc_scope, wc_period]
    enabled: true
