      - { id: D02-02, scenario: "Shipped 2026-04-01, presented 2026-04-25 (>21 days)",                expected: FAIL,   citations: [UCP-14-c] }
      - { id: D02-03, scenario: "Shipped 2026-04-25, expiry 2026-05-01, presented 2026-05-02",        expected: FAIL,   citations: [UCP-14-c] }
      - { id: D02-04, scenario: "Multiple BLs — earliest on-board governs",                            expected: PASS,   citations: [UCP-14-c] }

  - rule_id: DATE-03
    enabled: false
    name: No shipment after latest shipment date
