# =============================================================================
# catalog-v3.yml — proposed v3 design rule catalog
# =============================================================================
#
# This file is a DESIGN PROPOSAL — it is NOT loaded by the v2 runtime.
# The governance UI reads this file as the "proposed" view. The active
# runtime catalog remains catalog.yml until migration.
#
# Differences from catalog.yml (v2):
#   - 33 rules organized by UCP examination category (DATE/DOCSET/AMT/PARTY/
#     GOODS/TRANS/INS/CERT/EXAM)
#   - prompt_path replaces inline prompt_instruction; .tokenized.st is the
#     contract artifact, no .st prose file
#   - ucp_excerpt removed — rules cite by ID; runtime resolves to ref text
#   - eval_cases — golden test set per rule (gates promotion to PUBLISHED)
#   - health_signals — production telemetry slots (override_rate, doubts_rate,
#     eval_pass_rate, p95_latency_ms, cost_usd_per_check). Synthetic seeds
#     here for prototype demonstration.
#   - policy_overlays — jurisdictional differences (e.g. policy.cn signature
#     interpretation). Empty for most rules.
#   - output_schema — JSON contract for LLM verdicts, declared per rule
#   - version + changelog — semantic versioning of rule definition
#
# Token grammar consumed by tokenized prompts:
#   {{rule.id}} {{rule.severity}} {{rule.polarity}} {{rule.waivable}}
#   {{ref.UCP-14-c}} or {{ref.UCP-14-c.text}} or {{ref.UCP-14-c.heading}}
#   {{lc.<field>}}              parsed canonical LC field
#   {{lc.raw.<tag>}}            raw SWIFT tag content (escape hatch)
#   {{lc.fullText}}             entire MT700 message
#   {{doc.<TYPE>.<field>}}      parsed canonical doc field
#   {{doc.<TYPE>.fullText}}     entire extracted document text
#   {{system.today}}            issuing-bank "today"
#   {{system.presentationDate}} presentation date passed at runtime
#   {{system.outputSchema}}     resolved from rule.output_schema
#
# Validation contract (enforced at runtime startup):
#   - Every {{lc.<f>}} or {{doc.<T>.<f>}} field must appear in field_keys
#   - Every {{ref.<id>}} must appear in ucp_refs or isbp_refs
#   - Failing rules block service start; surfaced in governance UI as
#     contract violations.

catalog_version: 3.0.0-design
generated: 2026-05-04

rules:

# =============================================================================
# A. DATE conformance — UCP 14(c), 14(i)
# =============================================================================

  - rule_id: DATE-01
    enabled: false
    name: No document dated after presentation date
    category: DATE
    version: 1
    severity: MAJOR
    polarity: POSITIVE
    waivable: false
    applies_to: [INV, BOL, PKL, BOE, BC, WC]
    triggers: { any_of: [{docs_present: [INV]}, {docs_present: [BOL]}, {docs_present: [PKL]}] }
    lc_fields_required: []
    field_keys: [document_date, invoice_date, bl_date, pkl_date, boe_date]
    ucp_refs: [UCP-14-i]
    isbp_refs: [ISBP-A19]
    check_type: PROGRAMMATIC
    expression: |
      T(com.lc.v2.checker.stage.examine.MultiDocHelpers).docDatesValid(
        #docs, T(java.time.LocalDate).parse(#presentationDate))
    output_schema: '{"verdict":"PASS|FAIL","explanation":"<one sentence>"}'
    health_signals: { eval_pass_rate: 1.00, override_rate: 0.01, doubts_rate: 0.00, p95_latency_ms: 4, cost_usd_per_check: 0.0000 }
    policy_overlays: {}
    eval_cases:
      - { id: D01-01, scenario: "All docs dated within window",        expected: PASS, citations: [UCP-14-i] }
      - { id: D01-02, scenario: "Invoice dated +1 day post-presentation", expected: FAIL, citations: [UCP-14-i] }
      - { id: D01-03, scenario: "Doc dated prior to LC issuance — explicitly OK", expected: PASS, citations: [UCP-14-i] }

