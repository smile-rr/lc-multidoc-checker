    prompt_path: prompts/check/DOCSET-01.tokenized.st
    output_schema: '{"verdict":"PASS|FAIL|DOUBTS","explanation":"<one sentence>","confidence":<0.0-1.0>,"missing_docs":["<doc_label>"]}'
    health_signals: { eval_pass_rate: 0.92, override_rate: 0.06, doubts_rate: 0.08, p95_latency_ms: 1400, cost_usd_per_check: 0.0028 }
    policy_overlays: {}
    eval_cases:
