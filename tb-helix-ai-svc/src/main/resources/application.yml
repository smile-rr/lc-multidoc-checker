# ============================================================================
# tb-helix-ai-svc
#
# Configuration philosophy, unchanged from v3: operational knobs are hardcoded
# here and change by rebuild; `.env` holds only secrets and Mac-local overrides.
# A knob that can be changed without review is a knob that will be.
#
# Nothing in this file names a vendor. Model slots are numbered and uniform, and
# `extra-body` is the generic escape hatch that carries provider quirks (Qwen's
# enable_thinking, response_format) without the abstraction learning what Qwen is.
# ============================================================================

spring:
  application:
    name: tb-helix-ai-svc
  config:
    import:
      - "optional:file:../.env[.properties]"
  profiles:
    active: default
  devtools:
    restart:
      log-condition-evaluation-delta: false

  autoconfigure:
    exclude:
      # L2 is design-complete and switched off. Excluding the autoconfiguration
      # keeps a disabled tier from opening a connection at boot; the RedisTier
      # bean is @ConditionalOnProperty and its @Import turns this back on.
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  servlet:
    multipart:
      # A scanned TIFF bundle is the largest thing that arrives here.
      max-file-size: 80MB
      max-request-size: 120MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lc_checker}
    username: ${DB_USERNAME:lcuser}
    password: ${DB_PASSWORD:lcdev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      connection-test-query: SELECT 1
      validation-timeout: 3000
      keepalive-time: 60000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schemas this service owns. The first is where flyway_schema_history
    # lives. Application tables left helix_core in V12; the history table itself
    # moves to helix_infra before migrate() (see FlywayConfig) so a migration
    # never has to relocate the row that records its own success.
    schemas: helix_infra,helix_check,helix_gov
    create-schemas: true
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 9090

# ============================================================================
# Helix
# ============================================================================
helix:

  # --- Blob store ---------------------------------------------------------
  # Content-addressed. No case folders and no doc-type folders: the catalogue
  # (helix_infra.blob + blob_ref) answers "which blobs belong to case X", which
  # is what makes dedup free — the same bundle uploaded twice is one file.
  blob:
    tier: ${HELIX_BLOB_TIER:DISK}                       # DISK | S3 (S3 adapter is a stub for now)
    # Absolute under the user home so Linux / macOS / Windows share one layout
    # without depending on the process CWD (./var/blob used to land inside the
    # Gradle module). Override with HELIX_BLOB_ROOT when needed.
    root: ${HELIX_BLOB_ROOT:${user.home}/ws/tmp/var/blob}
    # A human-navigable symlink mirror under by-case/. Costs nothing, and makes
    # "show me what this case actually holds" a shell command. Best-effort: if
    # the OS refuses symlinks (common on Windows without Developer Mode), the
    # store still works — only the mirror is skipped.
    link-by-case: true
    # How long an unreferenced blob survives before GC will take it. Long,
    # because the thing being collected is evidence.
    orphan-grace: 30d

  # --- Cache tiers --------------------------------------------------------
  cache:
    l1:
      enabled: true
      # Bounded by weight, unlike the unbounded byte[] map this replaces. Page
      # renders dominate: a 200 DPI page is ~1.5 MB.
      max-weight-mb: 512
      ttl: 10m
    l2:
      enabled: false                 # design complete, switched off
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ttl: 24h
    l3:
      enabled: true
      # Where durable derivation answers live.
      #   DISK — JSON (+ optional .md) under disk-root (local default)
      #   DB   — helix_infra.derivation (system / shared testing)
      #   S3   — not yet
      storage: ${HELIX_CACHE_L3_STORAGE:DB}
      disk-root: ${HELIX_CACHE_L3_DISK_ROOT:${user.home}/ws/tmp/var/derivation}
      # When storage=DISK, also write <cache_key>.md with the raw model text.
      write-md: ${HELIX_CACHE_L3_WRITE_MD:true}
      # Per-op TTL. Deterministic ops never expire — the answer cannot go stale
      # if nothing about it can change.
      #
      # Bracket notation is required, not decoration: Spring binds a dotted map key
      # as a NESTED map, so `convert.tiff_pdf: 0` becomes {convert:{tiff_pdf:0}},
      # every per-op lookup misses, and everything silently gets the fallback.
      ttl:
        "[default]": 90d
        "[convert.tiff_pdf]": 0       # 0 = never
        "[render.pages]": 30d
        "[extract.credit]": 0       # deterministic at temperature 0
        "[segment.bundle]": 90d
        "[extract.doc]": 90d
        "[extract.doc.md]": 90d
        "[plan.requirements]": 30d
        "[judge.rule]": 30d
        "[judge.agent]": 30d
      purge-cron: "0 30 3 * * *"

  # --- Document handling --------------------------------------------------
  render:
    # Quality knob, not the cost knob. Tokens scale with PIXEL AREA, so this is
    # nearly free: rendering at 300 and downscaling to the cap beats rendering at
    # 150, for identical tokens and a better image.
    dpi: 300

    # Rendered pages are VLM input; the browser never sees one. A render is ~1.5 s
    # against a 30 s model call, and the cache is consulted before rendering — so
    # persisting 1.5 MB per page buys almost nothing. Turn on for a "show me what
    # the model saw" view, not for speed.
    persist-pages: false

    # Refuse rather than silently truncate. A 400-page bundle is a mis-scan or a
    # different kind of deal, and quietly examining the first N pages would look
    # exactly like examining all of them. Segment batches internally up to
    # profiles.segment.max-pages per vision call; this is the hard ceiling.
    max-bundle-pages: 150

    # The money knob, per role. Segmentation only asks "what kind of page is this?"
    # and does that fine at 800 px; extraction has to read a unit price. Running a
    # 100-page bundle through segmentation at extraction resolution costs roughly
    # ten times what it needs to.
    #
    #   long edge   ≈ tokens/page   100 pages
    #      800           ~90            ~9k
    #     1280          ~370           ~37k
    #     1600          ~580           ~58k
    #     2048          ~945           ~95k
    profiles:
      # max-pages = one vision call. Bundles larger than this are segmented in
      # successive batches with the previous batch's last docType as context so a
      # document that straddles the boundary stays one document.
      segment: { max-long-edge-px: 800,  max-pages: 40 }
      extract: { max-long-edge-px: 1600, max-pages: 12 }
      # Scanned credit → SWIFT dump. Needs to read tags; same budget as extract.
      transcribe: { max-long-edge-px: 1600, max-pages: 12 }
      # Only when a human disputes what the model read.
      forensic: { max-long-edge-px: 2600, max-pages: 4 }

  convert:
    # Bitonal CCITT G4 frames are re-embedded rather than rasterised. Scanned
    # bank documents are overwhelmingly G4, and rasterising a 2 MB fax to RGB
    # inflates it to ~40 MB for no gain in what the model can read.
    preserve-ccitt: true

  # --- Models -------------------------------------------------------------
  # Slots are numbered and uniform; a provider switch is base-url + api-key.
  models:
    # Every slot names the backend that owns it. Absent means `chat-completions`, which is
    # what every slot here has always been, so nothing below needs the line.
    #
    # `spring-ai` is the second backend (harness/llm/springai). It exists to reach providers
    # that are not OpenAI-shaped — Anthropic, and Bedrock or Vertex when they are added —
    # without writing and then maintaining a wire adapter per vendor. A slot on it also names
    # `provider: openai | anthropic`, which chooses the ChatModel to build.
    #
    # Three things to know before moving a role onto it:
    #
    #   1. It refuses images, deliberately and loudly. Spring AI's UserMessage carries text
    #      and media separately, so images-before-instruction cannot be expressed — and the
    #      wrong order roughly triples the interpret bill while reporting nothing. segment,
    #      extract and transcribe stay on chat-completions.
    #   2. extra-body has nowhere to go: its options are typed. A slot needing
    #      enable_thinking:false — every Qwen-family model — belongs on chat-completions.
    #      The backend logs any hint it could not apply rather than dropping it silently.
    #   3. Moving a role changes its derivation-cache identity (backend/model@host is part of
    #      the key), so the first run after a switch recomputes rather than serving answers
    #      the other backend produced. That is the point, not a cost to avoid.
    #
    # An A/B is therefore a slot, not a branch: point llm-2 at the same model and endpoint as
    # llm-1 with backend: spring-ai, move one role to it, and compare the two in the ledger.
    #
    #   llm-3:
    #     enabled: false
    #     backend: spring-ai
    #     provider: anthropic
    #     base-url: ${LLM_3_BASE_URL:https://api.anthropic.com}
    #     api-key: ${LLM_3_API_KEY:}
    #     model: ${LLM_3_MODEL:claude-sonnet-4-5}
    #     temperature: 0
    #     max-tokens: 8192
    text:
      llm-1:
        enabled: true
        base-url: ${LLM_1_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${LLM_1_API_KEY:${VISION_1_API_KEY:}}
        model: ${LLM_1_MODEL:qwen3.7-flash}
        # Zero, always, for anything cacheable. A cached answer from a sampling
        # call is a lie about repeatability.
        temperature: 0
        max-tokens: 8192
        connect-timeout: 10s
        read-timeout: 180s
        max-retries: 2
        extra-body:
          enable_thinking: false
      llm-2:
        enabled: false
        base-url: ${LLM_2_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${LLM_2_API_KEY:}
        model: ${LLM_2_MODEL:qwen3.6-plus}
        temperature: 0
        max-tokens: 8192
        connect-timeout: 10s
        read-timeout: 180s
        max-retries: 2
        extra-body:
          enable_thinking: false

    vision:
      vlm-1:
        enabled: true
        base-url: ${VLM_1_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${VLM_1_API_KEY:${VISION_1_API_KEY:}}
        model: ${VLM_1_MODEL:qwen3.7-flash}
        temperature: 0
        max-tokens: 4096
        connect-timeout: 10s
        read-timeout: 240s
        max-retries: 1
        # Per-slot render params. Two slots at different DPI get two renders and
        # two cache keys — v2 hashed each slot's DPI into its key but rendered
        # once using slot 1's, so the key described a request that never happened.
        render:
          dpi: 200
          max-pages: 12
          max-long-edge-px: 2048
        extra-body:
          enable_thinking: false
          response_format:
            type: json_object
      vlm-2:
        enabled: false
        base-url: ${VLM_2_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${VLM_2_API_KEY:${VISION_2_API_KEY:}}
        model: ${VLM_2_MODEL:qwen3.6-vl-plus}
        temperature: 0
        max-tokens: 4096
        connect-timeout: 10s
        read-timeout: 240s
        max-retries: 1
        render:
          dpi: 200
          max-pages: 12
          max-long-edge-px: 2048
        extra-body:
          enable_thinking: false
          response_format:
            type: json_object

  # Domain code asks for a role, never a slot. More than one slot on a role means
  # consensus: they run in parallel and vote, first slot breaking ties.
  roles:
    segment:    [vlm-1]
    read-text:  [llm-1]
    extract:    [vlm-1]
    transcribe: [vlm-1]
    plan:       [llm-1]
    judge:      [llm-1]
    narrate:    [llm-1]

  # --- The gateway itself, not any one provider ---------------------------
  llm:
    # How many tools from ONE model turn are run at once.
    #
    # Not a turn budget and not related to one — helix.check.plan.max-turns bounds how many
    # completions a conversation may take, and this bounds how long a single turn takes to
    # answer. A model that asks for six conditions to be checked gets one round trip either
    # way; the only question is whether the six compilations happen one after another inside
    # it. They are independent by construction, so they do not have to.
    #
    # Four rather than more because a tool handler here is CPU-bound local work — RuleCompiler
    # against the dictionary — not a network call, and the thing being overlapped is
    # milliseconds of it. Raising this buys nothing once the handlers outnumber the cores.
    tool-concurrency: 4

  # --- lc-check -----------------------------------------------------------
  check:
    catalog:
      # LIVE reads check_def directly, so an edit in Governance takes effect on
      # the next run — right for development. RELEASE reads the pinned snapshot,
      # which is what makes an examination defensible. Switch at cutover.
      pin-mode: ${HELIX_CATALOG_PIN:LIVE}
    interpret:
      # How many documents are read at once. Each one is three vision calls over its
      # own pages — independent of every other document, which is why they fan out.
      #
      # The passes WITHIN a document stay sequential and are not affected by this:
      # they send byte-identical images and ride each other's prefix cache, which
      # only works if the first has returned. Firing them together would be faster
      # and cost about three times as much.
      #
      # Five, because of what breaks first, and it is not the model:
      #   heap      — a render loads the whole bundle; N at once is N copies
      #   provider  — one key, and a 429 costs more than it saves
      #   db pool   — maximum-pool-size is 10, shared with everything else
      # Raise it only with all three in view.
      concurrency: 5
    execute:
      # How many examiners are asked at once.
      #
      # The judged checks are grouped by the remit they fall in — time & availability,
      # transport, goods & pricing, the document set — and each group is ONE call
      # answering all of its checks, instead of one call per check each carrying the
      # whole presentation again.
      #
      # The first group runs ALONE and the rest fan out behind it. That is not
      # timidity: every group's prompt opens with the same fact sheet, and a provider
      # only holds that prefix once a call carrying it has returned. Firing all of
      # them together sends the same page of facts N times and is billed N times —
      # the same trap the three vision passes within one document avoid, for the same
      # reason. Change this to "all in parallel" and the bill goes up, not down.
      concurrency: 3
      # How many checks one examiner is asked about at once. A group is one answer
      # with one entry per check, and a long list is where entries start going
      # missing. A missing entry is recorded as DOUBT rather than lost — but it is
      # still a question that cost money and was not answered.
      group-size: 8
      # Whether an examiner is given the text of the articles their remit answers to,
      # rather than their numbers. A model asked to apply "UCP 600 art. 20" is being
      # asked what it remembers; one given the article is being asked to read. Costs
      # a few hundred tokens per group, per case.
      anchors: true
    agent:
      # Hard cap on an agentic rule's tool-calling turns. A per-rule
      # max_iterations may lower this; nothing raises it.
      max-iterations: 3
    plan:
      # Reasoning on, for the one call that weighs things against each other rather
      # than transcribing: a threshold verdict, twenty candidate rules and a page of
      # the applicant's own conditions, to a decision about what should run.
      #
      # Every slot ships enable_thinking:false because a Qwen3-family model that
      # thinks aloud leaks it into the JSON. This overrides it per call and relies on
      # LlmText.extractJson to lift the object back out. Turn it off here if a
      # provider mishandles it — the plan is then a plain structured call and the run
      # still works, less well.
      thinking: ${HELIX_PLAN_THINKING:true}
      # Completions the requirement reader may use, tools included.
      #
      # It is a tool loop for one reason: it writes conditions and cannot tell whether
      # what it wrote will be accepted. `check_condition` tells it, before it commits,
      # and the alternative is a silently demoted card that costs a model call on
      # every presentation for ever.
      #
      # Four: one to draft, one or two to check and fix, one to answer. A budget spent
      # is treated as NO ANSWER — the dictionary rules still stand and the step records
      # that the credit's own conditions were not read, which is the honest outcome.
      max-turns: 4

  # --- Governance ---------------------------------------------------------
  governance:
    seed:
      # The catalogue this service starts with — its own, not a copy of anything
      # the UI renders. Per-table, only when empty: hand-authored rows carry
      # seeded=false and survive, because a reseed that overwrote them would
      # delete a person's work.
      enabled: true
      resource: classpath:seed/initial-catalogue.json

# ============================================================================
# Platform
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${LANGFUSE_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://192.168.31.214:3300/api/public/otel/v1/traces}
      headers:
        Authorization: "Basic ${LANGFUSE_AUTH_BASIC:}"
      compression: gzip
      timeout: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false
  default-produces-media-type: application/json
  packages-to-scan: com.tb.helix.lccheck.api,com.tb.helix.governance.api

logging:
  level:
    root: INFO
    com.tb.helix: DEBUG
    io.opentelemetry.exporter.internal.http: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %X{caseId:-} %X{stage:-} %X{checkId:-} %logger{36} - %msg%n"
