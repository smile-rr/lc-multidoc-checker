# Skip the configuration phase when the task graph is unchanged.
# Measured: `classes` drops from ~1–3s to ~0.4s on a cache hit — the continuous
# compile loop in `make watch` is the main beneficiary. Compatible with this
# single-module Spring Boot 3.5 / Gradle 9.4 build (classes, test, bootJar, bootRun).
org.gradle.configuration-cache=true

# Reuse task outputs across builds (complementary to configuration cache).
org.gradle.caching=true
